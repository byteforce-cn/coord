# proto 契约治理（buf lint + breaking）
#
# - lint：STANDARD 规则集；存量 proto 的命名类规则豁免（下表）——迁移为
#   包名版本化迁移推进中，迁移完成前不阻断；
#   其余规则（字段 snake_case、消息命名等）即时生效
# - breaking：FILE 级别（proto3 + gRPC 的安全默认；PACKAGE 级别过于宽松）
# - CI 用法：`buf lint coord-proto`、`buf format coord-proto --diff --exit-code`、
#   `buf breaking coord-proto --against ".git#branch=origin/main,subdir=coord-proto"`
# - 变更规约见 apis/contracts/README.md 与 apis/contracts/WHITEPAPER.md（契约版本与变更流程）
version: v2
modules:
  - path: src/proto
lint:
  use:
    - STANDARD
  except:
    # 包名版本化迁移完成前豁免
    - PACKAGE_VERSION_SUFFIX
    - SERVICE_SUFFIX
    # 存量 proto 命名迁移推进中
    - ENUM_VALUE_PREFIX
    - ENUM_ZERO_VALUE_SUFFIX
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
    # 单目录多包布局（`src/proto/*.proto` 平铺，迁移到按包分目录时解除）
    - DIRECTORY_SAME_PACKAGE
    - PACKAGE_DIRECTORY_MATCH
breaking:
  use:
    - FILE
  # ADR-0019 一次性 wire 破坏：transit（CCT3 / 命名密钥 / 签名）与 pki（key_pem →
  # key_material）按目标形状改写。合并后 main 基线即为新形状，紧随的 PR 删除这
  # 两条 ignore，恢复对这两个文件的 breaking 强制。
  ignore:
    - src/proto/transit.proto
    - src/proto/pki.proto
