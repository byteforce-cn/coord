syntax = "proto3";
package coord.raft;

// Wrapper for all Raft RPC messages (bincode-serialized payload from Openraft types)
message RaftMessage {
  bytes payload = 1;
  // v6.0 Multi-Raft: target Region ID for RPC demultiplexing
  uint64 region_id = 2;
  // v6.0 Multi-Raft: W3C Trace Context for distributed tracing
  bytes trace_context = 3;
  // R-SEC-03: HMAC-SHA256 tag over `payload`（无 mTLS 时的共享密钥认证；
  // 未配置共享密钥时为空）
  bytes auth_tag = 4;
  // RPC 载荷编码标记（ADR-0007）：0 = bincode（兼容默认，历史发送方不带该
  // 字段时 proto3 读作 0）；1 = postcard；其余值 fail-closed 拒绝（禁试错
  // 解码）。codec=1 时 auth_tag 输入为 DOMAIN || codec || payload（域分离）。
  uint32 payload_codec = 5;
}

// Internal Raft RPC service for node-to-node communication
// Runs on raft_addr (separate from client-facing gRPC)
service Raft {
  // AppendEntries: replicate log entries from Leader to Follower
  rpc AppendEntries(RaftMessage) returns (RaftMessage);

  // Vote: request vote during Leader election
  rpc Vote(RaftMessage) returns (RaftMessage);

  // TransferLeader: 领导权转移。Leader 向每个 voter 广播 TransferLeader 请求，
  // 目标节点（req.to）据此立即发起带 leadership_transfer 的选举接管领导权。
  // payload = bincode(openraft TransferLeaderRequest)；region_id 用于 Multi-Raft 解复用。
  rpc TransferLeader(RaftMessage) returns (RaftMessage);

  // InstallSnapshot: send full state snapshot to lagging Follower
  rpc InstallSnapshot(RaftMessage) returns (RaftMessage);

  // InstallSnapshotStreaming (R-RFT-06): client-streaming snapshot transfer.
  // 每帧为 RaftMessage（payload = bincode(SnapshotStreamMessage)），
  // follower 侧重组后安装；避免整包单条 gRPC 超出解码上限。
  rpc InstallSnapshotStreaming(stream RaftMessage) returns (RaftMessage);

  // SubmitPdOp (R-MR-08 / D1-a P5): 把一条 PD 队列命令（bincode(PdOp)）提交到
  // 目标节点 **本地的 region 0 raft** 并等待 apply，返回日志 index。
  //
  // 用途：PD operator 执行器在「目标 Region 的当前 leader」节点运行，但
  // region 0（system raft）的 `client_write` 只有其 leader 节点可本地提出；
  // 非 region 0 leader 节点的执行器经本 RPC 把 Claim/Complete/Requeue 转发到
  // region 0 leader 节点提出（跟随 openraft 的 ForwardToLeader 语义）。
  // 请求 region_id = 0（region 0 承载 PD 队列）；payload = bincode(PdSubmitOp)，
  // 响应 payload = bincode(PdSubmitReply{index,error})。节点间认证（共享密钥
  // HMAC / mTLS）与其他 Raft RPC 同口径。
  rpc SubmitPdOp(RaftMessage) returns (RaftMessage);

  // DrainRange: split/merge 搬迁前把区间 drain 扇出到每个协调节点。
  //
  // 会话只活在协调节点内存，drain 不需要复制状态：接收方在本 RPC 的
  // 生命周期内用本地 `TxnSessions` 等待与区间相交的事务收尾，超时/断连即
  // 释放 drain 标记。请求 region_id = 0；payload = postcard(
  // DrainRangePayload{start_key,end_key,timeout_ms})，响应 payload =
  // postcard(DrainRangeReply{drained,error})。节点间认证（共享密钥 HMAC /
  // mTLS）与其他 Raft RPC 同口径。
  rpc DrainRange(RaftMessage) returns (RaftMessage);

  // SubmitRegionCommand: 把一条数据 Region 的内部命令转发到该 Region 的
  // **leader 节点**提出并等待 apply。
  //
  // 用途：split 目标 Region 预创建后，执行节点（源 Region leader）不一定也是
  // 目标组的 leader；`client_write` 只有 leader 能本地提出（follower 返回
  // ForwardToLeader）。搬迁器用本 RPC 把 ClearImportRange / ImportRange 提到
  // 目标组 leader（openraft 不替应用层转发客户端写）。请求 region_id = 目标
  // Region；payload = postcard(RegionCommandPayload{region_id,command})，响应
  // payload = postcard(RegionCommandReply{error,response})。接收方必须自己是该组
  // leader，否则在 `error` 里回报（调用方刷新 leader 视图后重试）。节点间认证
  // （共享密钥 HMAC / mTLS）与其他 Raft RPC 同口径；导入 apply 幂等，重放安全。
  rpc SubmitRegionCommand(RaftMessage) returns (RaftMessage);

  // ReportRegionStats: Region leader 把心跳统计（size/keys/chunk 字节/leader/
  // 采样 Key）上报到 region 0 leader 节点的 PD（operator 生成源）。
  //
  // 统计是派生瞬态数据（不落盘、不进 raft 日志）：走节点间 RPC 而非 region 0
  // raft，避免为每拍心跳引入共识 + fsync；丢失/换届只损失一拍，下一拍重报。
  // 请求 region_id = 0；payload = postcard(RegionStatsPayload{...})，响应
  // payload = postcard(RegionStatsReply{error})。节点间认证（共享密钥 HMAC /
  // mTLS）与其他 Raft RPC 同口径；接收方不是 region 0 leader 时仍可接收
  // （PD 内存视图在所有节点都可写），调度只读 leader 节点的视图。
  rpc ReportRegionStats(RaftMessage) returns (RaftMessage);
}
