syntax = "proto3";

// ============================================================
// Coord 对外契约 — 工作流（Saga）（能力承诺面，v1.2）
//
// 状态：COMMITTED（承诺中）｜ 目标日期：2027-03-31 ｜ 状态表：apis/contracts/STATUS.md
// wire 基线：coord-proto/src/proto/workflow.proto 的 coord.workflow.v1.Workflow
//            （字段编号/类型逐项一致；迁移 = 机械式重挂载，禁止趁机改 wire）
//
// 验收口径与目标日期约定见 WHITEPAPER.md。
// ============================================================

package coord.workflow.v1;

option java_multiple_files = true;
option java_package = "cn.byteforce.coord.contracts.workflow.v1";
option go_package = "github.com/byteforce/coord/apis/contracts/gen/go/coord/workflow/v1;workflowv1";

// ============================================================

service Workflow {
  rpc Start(WorkflowStartRequest) returns (WorkflowStartResponse);
  rpc GetStatus(WorkflowGetStatusRequest) returns (WorkflowGetStatusResponse);
  rpc Signal(WorkflowSignalRequest) returns (WorkflowSignalResponse);
  rpc Cancel(WorkflowCancelRequest) returns (WorkflowCancelResponse);

  // 工作流定义管理
  rpc Deploy(WorkflowDeployRequest) returns (WorkflowDeployResponse);
  rpc ListDefinitions(WorkflowListDefinitionsRequest) returns (WorkflowListDefinitionsResponse);
  rpc GetDefinition(WorkflowGetDefinitionRequest) returns (WorkflowGetDefinitionResponse);

  // 工作流定义版本化 / 回滚（对齐 policy PutBundle 语义）
  rpc ListDefinitionVersions(WorkflowListDefinitionVersionsRequest) returns (WorkflowListDefinitionVersionsResponse);
  rpc RollbackDefinition(WorkflowRollbackDefinitionRequest) returns (WorkflowRollbackDefinitionResponse);

  // 工作流实例管理
  rpc ListInstances(WorkflowListInstancesRequest) returns (WorkflowListInstancesResponse);

  // 保留策略：删除定义（能力门禁 `coord:workflow:define`）。
  //
  // 前置条件：没有任何实例引用该 (namespace, name, version)——否则
  // FAILED_PRECONDITION（先删/截断引用实例）。删除后 GetDefinition /
  // RollbackDefinition 指向该版本返回 NOT_FOUND；同名同版本可重新 Deploy
  // （= 全新定义）。删除不可回滚。
  rpc DeleteDefinition(WorkflowDeleteDefinitionRequest) returns (WorkflowDeleteDefinitionResponse);

  // 保留策略：删除实例（能力门禁 `coord:workflow:execute`）。
  //
  // 仅终态实例可删（COMPLETED / FAULTED / CANCELLED）；运行 / 等待 / 挂起中
  // 返回 FAILED_PRECONDITION（先 Cancel）。删除不可回滚（无归档副本）。
  rpc DeleteInstance(WorkflowDeleteInstanceRequest) returns (WorkflowDeleteInstanceResponse);

  // 人工审批 v2（ADR-0013 D7）。命令类能力门禁 `coord:workflow:execute`。
  rpc Approve(WorkflowApproveRequest) returns (WorkflowApproveResponse);
  rpc Reject(WorkflowRejectRequest) returns (WorkflowRejectResponse);
  rpc Acknowledge(WorkflowAcknowledgeRequest) returns (WorkflowAcknowledgeResponse);
  rpc AddSign(WorkflowAddSignRequest) returns (WorkflowAddSignResponse);
  rpc RemoveSign(WorkflowRemoveSignRequest) returns (WorkflowRemoveSignResponse);
  rpc ReturnToNode(WorkflowReturnToNodeRequest) returns (WorkflowReturnToNodeResponse);
  rpc Transfer(WorkflowTransferRequest) returns (WorkflowTransferResponse);
  rpc Delegate(WorkflowDelegateRequest) returns (WorkflowDelegateResponse);
  rpc Withdraw(WorkflowWithdrawRequest) returns (WorkflowWithdrawResponse);
  rpc Terminate(WorkflowTerminateRequest) returns (WorkflowTerminateResponse);
  // 任务级动作：催办 / 抄送 / 撤回（不改实例终态；撤回在一条命令内回退到目标节点）。
  rpc Urge(WorkflowUrgeRequest) returns (WorkflowUrgeResponse);
  rpc Cc(WorkflowCcRequest) returns (WorkflowCcResponse);
  rpc WithdrawTask(WorkflowWithdrawTaskRequest) returns (WorkflowWithdrawTaskResponse);
  // 等待态恢复（`approve.timeoutPolicy: waiting` 超时后）：按上一轮席位重建任务并写新截止。
  rpc ResumeWorkflow(WorkflowResumeWorkflowRequest) returns (WorkflowResumeWorkflowResponse);

  // 人工审批 v2 查询。能力门禁 `coord:workflow:read`。
  rpc ListPendingTasks(WorkflowListPendingTasksRequest) returns (WorkflowListPendingTasksResponse);
  rpc GetInstanceDetail(WorkflowGetInstanceDetailRequest) returns (WorkflowGetInstanceDetailResponse);

  // 任务查询面：按实例 / 可处理主体 / 投票人 / 候选 / 节点 / 状态 / 截止时间过滤。
  // `ListPendingTasks` 保持既有语义（未决 + 调用方/代查 assignee）；`ListTasks` 是它的
  // 超集（默认不过滤状态）。
  rpc ListTasks(WorkflowListTasksRequest) returns (WorkflowListTasksResponse);
  // 轮次级任务查询：一个 `ApprovalTaskGroup` 是 seedj 的一个 `HumanTask`（同轮席位聚合），
  // `page_size` 是本页**任务（轮次）数**的严格上限，`page_token` 定位到 (实例, 轮次)。
  rpc ListTaskGroups(WorkflowListTaskGroupsRequest) returns (WorkflowListTaskGroupsResponse);
  rpc GetTask(WorkflowGetTaskRequest) returns (WorkflowGetTaskResponse);

  // 实例历史：从审批聚合快照**确定性投影**出的事件流（task / round / step / instance 级）。
  // 与 outbox 的 7 个生命周期事件不同，本 RPC 面向读模型：同一实例的同一状态必然产出
  // 同一批 (event_id, event_type, occurred_at)，可重复读取。
  rpc History(WorkflowHistoryRequest) returns (WorkflowHistoryResponse);
}

message WorkflowStartRequest {
  string definition_dsl = 1; // CNCF Workflow DSL JSON
  bytes input = 2;
  string definition_id = 3; // 可选：按已部署定义启动（与 definition_dsl 互斥）

  // 幂等键（可选）：同键重放返回**首次**创建的 workflow_id，且不会重置既有实例状态；
  // 作用域是 definition（不同定义的同一个键互不影响）。空串 = 不启用幂等。
  // 与 `workflow_id` 互斥（两者都指定实例身份）。
  string idempotency_key = 4;

  // 可选：调用方指定实例 id（空 = 服务端生成）。同 id 重放：
  // - 同定义（ns/name/version + 内容哈希）⇒ 返回首次创建的实例，不重置状态；
  // - 不同定义或不同版本 ⇒ `ALREADY_EXISTS`（不覆盖既有实例）。
  // 合法字符集与上限：不含 `/`，不超过 128 字节。
  string workflow_id = 5;
  // 服务代终端用户发起（与命令族的 `on_behalf_of` 同构）：调用方服务必须在
  // `services.workflow_on_behalf_services` 白名单内。`initiator`（实例 / 审计 /
  // 自审批守卫）落被代表用户；调用服务记入 `acting_service`
  // （`GetInstanceDetail` / `History` 的 `INSTANCE_STARTED` 可读）。
  // 空 = 直接以 CCT 主体发起（现状）。
  string on_behalf_of = 6;
}

message WorkflowStartResponse {
  string workflow_id = 1;
}

message WorkflowGetStatusRequest {
  string workflow_id = 1;
}

message WorkflowGetStatusResponse {
  string workflow_id = 1;
  string status = 2; // PENDING, RUNNING, WAITING, SUSPENDED, COMPLETED, FAULTED, CANCELLED
  bytes output = 3;
  string error_message = 4;
  string definition_name = 5; // 工作流定义名称
  bytes input = 6; // 启动时传入的输入参数
  int64 created_at = 7; // 实例创建时间（Unix ms）
  int64 updated_at = 8; // 实例最后更新时间（Unix ms）
  // 当前任务执行栈（可选）。task_name 为引擎原始任务名，含编译期内部名
  // （`<状态>__route` 等），供诊断；业务阶段判定请用 current_state_name。
  repeated TaskFrame task_stack = 9;
  // 当前状态名：定义里声明的稳定状态名（如 `human` / `autostart`）。
  // CNCF SW 编译器为路由/转移生成的内部任务名（`<状态>__route` / `<状态>__transition`
  // / `<状态>__action_<i>` 等）在读取时归一化回声明状态名，绝不回报；
  // 遗留 `document/do` DSL 无「声明状态」概念，仍为当前任务名。
  string current_state_name = 10;
  SuspensionMeta suspension = 11; // 挂起元信息（SUSPENDED/WAITING 时返回）
  // 实例启动时钉死的定义身份（版本为空 = 遗留存储未钉死版本）。
  string definition_namespace = 12;
  string definition_version = 13;
  // 结构化 fault（RFC 7807 投影）。`error_message` 保留兼容（= fault.title）；
  // 未失败时该消息缺省。
  WorkflowFault fault = 14;
  // 审批聚合状态（大写：RUNNING / COMPLETED / REJECTED / CANCELLED / TERMINATED / FAULTED）；
  // 无审批聚合（未进入 approve 节点）为空。用于区分工作流状态同为 FAILED 的
  // 「管理终止」与「运行 fault」。
  string approval_status = 15;
}

// 结构化工作流错误（RFC 7807 Problem Details 的 wire 投影）。
// `error_message` 仍是 `title` 的兼容副本；结构化消费方读本消息。
message WorkflowFault {
  string type = 1; // 标准错误类型 URI（如 `.../errors/timeout`）
  string title = 2; // 人类可读摘要
  string detail = 3; // 详细说明
  uint32 status = 4; // 建议 HTTP 状态码（RFC 7807）
  string instance = 5; // 错误定位（JSON Pointer），可空
}

// 挂起元信息（对应 WorkflowInstance.suspension_meta）
message SuspensionMeta {
  string reason = 1; // "wait" | "call" | "listen" | "signal" | "run" | "retry"
  int64 until_ms = 2; // wait/retry 到期时间（Unix ms，可选）
  string expected_signal = 3; // 期望的 signal 名（人工审批挂起，可选）
  string event_type = 4; // listen 事件类型（可选）
  string service = 5; // call 目标服务（可选）
}

// 任务栈帧（对应 WorkflowInstance.task_stack）
message TaskFrame {
  string task_name = 1;
  string task_type = 2;
  string status = 3;
  bytes input = 4;
  bytes output = 5;
  int64 started_at = 6;
  int64 ended_at = 7;
  int32 retry_count = 8;
}

message WorkflowSignalRequest {
  string workflow_id = 1;
  string signal_name = 2;
  bytes payload = 3;
  string idempotency_key = 4; // 幂等键，重复 signal 不会重复执行
}

message WorkflowSignalResponse {}

message WorkflowCancelRequest {
  string workflow_id = 1;
  // 可选：取消原因（写入 `History` 的 `INSTANCE_CANCELLED` 属性与审计）。
  string reason = 2;
  // 可选：调用方要求业务补偿（Saga 逆序）。coord 只把该标记持久化并投影到
  // `INSTANCE_CANCELLED.attributes.compensate`；**不**执行逆操作——补偿动作属于调用方的
  // 业务领域模型，coord 不猜测逆步骤。
  bool compensate = 3;
}

message WorkflowCancelResponse {}

// 工作流定义管理（Phase B.1 新增）

message WorkflowDeployRequest {
  string namespace = 1;
  string definition_yaml = 2;
}

message WorkflowDeployResponse {
  string workflow_id = 1;
  string version = 2;
  string namespace = 3;
  string name = 4; // YAML 中定义的 workflow name
}

message WorkflowListDefinitionsRequest {
  string namespace = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message WorkflowListDefinitionsResponse {
  repeated WorkflowDefinitionSummary definitions = 1;
  string next_page_token = 2;
}

message WorkflowDefinitionSummary {
  string workflow_id = 1;
  string name = 2;
  string version = 3;
  string status = 4;
  int64 created_at = 5;
}

message WorkflowGetDefinitionRequest {
  string workflow_id = 1;
  // 按 (namespace, name, version) 直取（与 workflow_id 二选一；两者都空 ⇒
  // INVALID_ARGUMENT）。供 `FindDefinition(namespace, name, major.minor)` 语义使用：
  // version 是定义里的版本串（coord 不强制 `major.minor`，但按字符串精确匹配）。
  string namespace = 2;
  string name = 3;
  string version = 4;
}

message WorkflowGetDefinitionResponse {
  string workflow_id = 1;
  string name = 2;
  string definition_yaml = 3;
  string version = 4;
  string status = 5;
  int64 created_at = 6;
  // 定义内容哈希（与实例 `definition_hash` 同口径）：同 (ns,name,version) 内容漂移
  // 即新哈希，客户端可据此判定「同版本不同内容」。
  string definition_hash = 7;
  // 规范化后的结构化定义（`WorkflowDefinition` 的 JSON 序列化）；客户端无需自行解析
  // YAML。字段为 coord 的 DSL 模型，未支持字段在 Deploy 期已 fail-closed。
  string definition_json = 8;
}

// 工作流定义版本化 / 回滚（对齐 policy PutBundle：原子覆盖 + 版本化 + 回滚）

message WorkflowListDefinitionVersionsRequest {
  string namespace = 1;
  string name = 2;
}

message WorkflowListDefinitionVersionsResponse {
  repeated WorkflowDefinitionVersion versions = 1;
}

message WorkflowDefinitionVersion {
  string version = 1; // 语义化版本字符串
  string workflow_id = 2; // 该版本的 definition ID
  string status = 3;
  int64 created_at = 4;
}

message WorkflowRollbackDefinitionRequest {
  string namespace = 1;
  string name = 2;
  string version = 3; // 要恢复的版本（回滚后以新版本落地）
}

message WorkflowRollbackDefinitionResponse {
  string workflow_id = 1;
  string version = 2; // 回滚后生成的新版本
  string namespace = 3;
  string name = 4;
}

message WorkflowListInstancesRequest {
  string workflow_id = 1; // 可选，为空则列出全部
  string namespace = 2;
  int32 page_size = 3;
  string page_token = 4;
  string status_filter = 5; // 可选，按状态过滤（PENDING/RUNNING/WAITING/SUSPENDED/COMPLETED/FAILED/CANCELLED）
  // 可选：按定义过滤。取值可以为定义名（name）或定义 ID；与 `workflow_id` 同义
  // （历史字段名保留）。
  string definition = 6;
  // 可选：按启动时间窗过滤（Unix ms，含边界）；0 = 不过滤。
  int64 started_after_ms = 7;
  int64 started_before_ms = 8;
  // 可选：多值状态过滤（任一命中即算匹配，与 `status_filter` 叠加为 OR）。空 = 不过滤。
  // 未知取值 INVALID_ARGUMENT。seedj 的 `RUNNING` 需要同时命中 coord 的
  // `RUNNING` 与 `SUSPENDED`（审批挂起）时传 `["RUNNING", "SUSPENDED"]`。
  repeated string status_in = 9;
}

message WorkflowListInstancesResponse {
  repeated WorkflowInstanceSummary instances = 1;
  string next_page_token = 2;
}

message WorkflowInstanceSummary {
  string instance_id = 1;
  string workflow_id = 2;
  string state = 3;
  int64 started_at = 4;
  int64 updated_at = 5;
  string definition_name = 6; // 工作流定义名称（用于列表展示）
  string namespace = 7; // 命名空间
  bytes output_json = 8; // 输出数据（JSON）
  bytes context_json = 9; // 运行时上下文（JSON）
  // 定义身份（实例启动时钉死的版本）；遗留存储可能为空。
  string definition_namespace = 10;
  string definition_version = 11;
  // 发起人（Start 注入的主体）；遗留存储可能为空。
  string initiator = 12;
  // 终态完成时间（Unix ms）；非终态为 0。
  int64 completed_at = 13;
}

// 删除定义（保留策略；定义未被任何实例引用才允许）
message WorkflowDeleteDefinitionRequest {
  string namespace = 1;
  string name = 2;
  string version = 3;
}

message WorkflowDeleteDefinitionResponse {}

// 删除实例（保留策略；仅终态实例）
message WorkflowDeleteInstanceRequest {
  string workflow_id = 1;
}

message WorkflowDeleteInstanceResponse {}

// 人工审批 v2（ADR-0013 D7）。
//
// - 命令请求末字段 `idempotency_key` 复用 Signal 的幂等语义：同键重放返回首个
//   响应，状态与事件只写一次；
// - 操作主体身份取自认证上下文（CCT），请求体不携带 actor 字段；
// - 命令响应 `status` 为大写实例状态：RUNNING / COMPLETED / REJECTED /
//   CANCELLED / TERMINATED；`GetInstanceDetailResponse.status` 同为该大写实例状态，
//   嵌套的 `branches[].status/join/reject`、`tasks[].status/kind`、`rounds[].status`
//   则是模型标签（引擎枚举的 wire 标签，非大写实例状态）。
message WorkflowApproveRequest {
  string workflow_id = 1;
  string task_id = 2;
  string comment = 3;
  string idempotency_key = 4;
  string on_behalf_of = 5; // 服务代终端用户执行时的被代表主体；空 = 直接以 CCT 主体执行
}

message WorkflowApproveResponse {
  string instance_id = 1;
  string status = 2;
}

message WorkflowRejectRequest {
  string workflow_id = 1;
  string task_id = 2;
  string comment = 3;
  string idempotency_key = 4;
  string on_behalf_of = 5; // 服务代终端用户执行时的被代表主体；空 = 直接以 CCT 主体执行
  // 可选：驳回即回退目标节点。非空时在**同一命令**内完成投票、关闭轮次/分支、重开
  // 目标节点（目标须在已进入节点白名单内）。空 = 仅记录否决票（既往语义：一票否决
  // 关闭轮次并终局否决实例，或按 `OnExhausted` 等待全员投完）。
  //
  // `RecordAndContinue` 策略下，若剩余未投席位仍能满足通过条件，则只记录否决票、
  // **不**回退（响应仍为 RUNNING，事件 `instance.returned` 不产生）。
  string target_node = 6;
}

message WorkflowRejectResponse {
  string instance_id = 1;
  string status = 2;
}

message WorkflowAcknowledgeRequest {
  string workflow_id = 1;
  string task_id = 2;
  string idempotency_key = 3;
  string on_behalf_of = 4; // 服务代终端用户执行时的被代表主体；空 = 直接以 CCT 主体执行
}

message WorkflowAcknowledgeResponse {
  string instance_id = 1;
  string status = 2;
}

// 加签位置。CURRENT = 向指定分支的当前轮次追加席位（既有语义）；BEFORE / AFTER =
// 以 `task_id` 为锚派生任务（前加签挂起原轮次，后加签在原轮次通过后执行）。
enum AddAssigneePosition {
  ADD_ASSIGNEE_POSITION_UNSPECIFIED = 0;
  ADD_ASSIGNEE_POSITION_CURRENT = 1;
  ADD_ASSIGNEE_POSITION_BEFORE = 2;
  ADD_ASSIGNEE_POSITION_AFTER = 3;
}

message WorkflowAddSignRequest {
  string workflow_id = 1;
  string branch_id = 2;
  repeated string approvers = 3;
  repeated string pool = 4;
  repeated string readers = 5;
  string comment = 6;
  string idempotency_key = 7;
  string on_behalf_of = 8; // 服务代终端用户执行时的被代表主体；空 = 直接以 CCT 主体执行
  // 可选：加签位置；缺省 CURRENT。BEFORE / AFTER 必须同时给 `task_id`，否则
  // INVALID_ARGUMENT（不静默退化为当前轮次加席位）。
  AddAssigneePosition position = 9;
  // 可选：锚定席位 id（BEFORE / AFTER 必填）。任务级加签归属判定按锚定席位所在
  // 分支的 `sign_admins`。
  string task_id = 10;
  // 可选：客户端 action id；写入派生任务的 `spawned_by_action_id`，供 seedj
  // `spawnedByActionId` 映射。空 = 派生任务不携带 action id。
  string action_id = 11;
}

message WorkflowAddSignResponse {
  string instance_id = 1;
  string status = 2;
  // 派生任务 id（CURRENT 时为本批新增席位；BEFORE / AFTER 时为前/后加签任务）。
  repeated string derived_task_ids = 3;
}

message WorkflowRemoveSignRequest {
  string workflow_id = 1;
  string branch_id = 2;
  repeated string task_ids = 3;
  string comment = 4;
  string idempotency_key = 5;
  string on_behalf_of = 6; // 服务代终端用户执行时的被代表主体；空 = 直接以 CCT 主体执行
  // 按 assignee 减签（seedj `RemoveAssigneeAction`）：非空时与 `task_ids` 互斥。
  // `task_id` 为锚定席位，仅用于定位轮次；实际移除该轮次中 assignee 匹配的未决席位。
  repeated string assignees = 7;
  string task_id = 8;
}

message WorkflowRemoveSignResponse {
  string instance_id = 1;
  string status = 2;
  // 实际被取消的席位 id（已表态/已终态的席位跳过）。
  repeated string removed_task_ids = 3;
  // 重算后的轮次计数与判定；按 assignee 减签时返回。
  ApprovalRound round = 4;
}

message WorkflowReturnToNodeRequest {
  string workflow_id = 1;
  string branch_id = 2;
  string target_node = 3;
  string comment = 4;
  string idempotency_key = 5;
  string on_behalf_of = 6; // 服务代终端用户执行时的被代表主体；空 = 直接以 CCT 主体执行
}

message WorkflowReturnToNodeResponse {
  string instance_id = 1;
  string status = 2;
}

message WorkflowTransferRequest {
  string workflow_id = 1;
  string task_id = 2;
  // 受让方：单个用户 principal。coord 不在动态动作上展开
  // GROUP / ROLE / DEPARTMENT；这类受让方由适配器 fail-closed。
  string to = 3;
  string comment = 4;
  string idempotency_key = 5;
  string on_behalf_of = 6; // 服务代终端用户执行时的被代表主体；空 = 直接以 CCT 主体执行
}

message WorkflowTransferResponse {
  string instance_id = 1;
  string status = 2;
}

message WorkflowDelegateRequest {
  string workflow_id = 1;
  string task_id = 2;
  // 被委派人：单个用户 principal。coord 不在动态动作上展开
  // GROUP / ROLE / DEPARTMENT；这类受让方由适配器 fail-closed。
  string to = 3;
  string comment = 4;
  string idempotency_key = 5;
  string on_behalf_of = 6; // 服务代终端用户执行时的被代表主体；空 = 直接以 CCT 主体执行
  // 可选：委派时长（毫秒）；0 = 不自动到期。到期由审批 deadline 定时器驱动恢复
  // （撤销代理权，原审批人继续可批），到期事件在 History 投影为 DELEGATION_EXPIRED。
  int64 delegate_for_ms = 7;
}

message WorkflowDelegateResponse {
  string instance_id = 1;
  string status = 2;
  // 委派到期时间（Unix ms）；0 = 不自动到期。
  int64 delegate_expires_at_ms = 3;
}

message WorkflowWithdrawRequest {
  string workflow_id = 1;
  string comment = 2;
  string idempotency_key = 3;
  string on_behalf_of = 4; // 服务代终端用户执行时的被代表主体；空 = 直接以 CCT 主体执行
  // 可选：seedj `WithdrawInstanceAction.targetStep`。非空时随 `Cancellation` 持久化，
  // 并在 History 投影 `INSTANCE_ROLLED_BACK{from_node,to_node}`；空 = 不投影回退事件。
  string target_node = 5;
}

message WorkflowWithdrawResponse {
  string instance_id = 1;
  string status = 2;
}

message WorkflowUrgeRequest {
  string workflow_id = 1;
  string task_id = 2;
  string message = 3;
  string idempotency_key = 4;
  string on_behalf_of = 5;
}

message WorkflowUrgeResponse {
  string instance_id = 1;
  string status = 2;
}

message WorkflowCcRequest {
  string workflow_id = 1;
  // 可选：任务级抄送（要求该节点 `allowCc: true`）；空 = 实例级抄送。
  string task_id = 2;
  repeated string recipients = 3; // 至少一个；空主体 INVALID_ARGUMENT
  string message = 4;
  string idempotency_key = 5;
  string on_behalf_of = 6;
}

message WorkflowCcResponse {
  string instance_id = 1;
  string status = 2;
}

message WorkflowWithdrawTaskRequest {
  string workflow_id = 1;
  string task_id = 2;
  string target_node = 3; // 已进入节点白名单内的回退目标
  string comment = 4;
  string idempotency_key = 5;
  string on_behalf_of = 6;
}

message WorkflowWithdrawTaskResponse {
  string instance_id = 1;
  string status = 2;
}

message WorkflowResumeWorkflowRequest {
  string workflow_id = 1;
  // 新的相对截止（毫秒，必须 > 0）；重建任务时换算为绝对 deadline。
  int64 new_due_in_ms = 2;
  string reason = 3;
  string idempotency_key = 4;
  string on_behalf_of = 5; // 服务代终端用户执行时的被代表主体；空 = 直接以 CCT 主体执行
}

message WorkflowResumeWorkflowResponse {
  string instance_id = 1;
  string status = 2;
  int64 deadline_ms = 3; // 新截止（Unix ms）
  repeated string task_ids = 4; // 重建的席位 id
}

message WorkflowTerminateRequest {
  string workflow_id = 1;
  string reason = 2;
  string idempotency_key = 3;
  string on_behalf_of = 4; // 服务代终端用户执行时的被代表主体；空 = 直接以 CCT 主体执行
}

message WorkflowTerminateResponse {
  string instance_id = 1;
  string status = 2;
}

// 待办审批席位查询。
message WorkflowListPendingTasksRequest {
  int32 page_size = 1;
  string page_token = 2;
  string assignee = 3; // 按席位责任人查询；空 = 调用方自身。服务代查须在 on-behalf 白名单内
}

message WorkflowListPendingTasksResponse {
  repeated PendingApprovalTask tasks = 1;
  string next_page_token = 2;
}

message PendingApprovalTask {
  string instance_id = 1;
  string task_id = 2;
  string node = 3;
  string branch_id = 4;
  string round_id = 5;
  string kind = 6;
  string status = 7;
  string assignee = 8;
  int64 deadline_ms = 9; // 超时阈值（Unix ms）；0 = 无超时
  int64 created_at_ms = 10; // 席位创建时间（Unix ms）
}

// 任务查询请求。所有过滤字段为空/0 = 不过滤。
message WorkflowListTasksRequest {
  int32 page_size = 1;
  string page_token = 2; // 上一页最后扫描到的实例 id（不透明）
  string instance_id = 3; // 只查该实例（不跨实例扫描）
  string assignee = 4; // 可处理该席位的主体：责任人 / 候选池成员 / 被委派人
  string completed_by = 5; // 投过票的 actor（含代批的 actor）
  string candidate_group = 6; // 候选池包含该主体/组
  string node = 7; // 节点（步骤）名
  // 席位状态：created|claimed|suspended|scheduled|completed|rejected|cancelled|withdrawn|expired；
  // 空 = 全部。未知取值返回 INVALID_ARGUMENT。
  string status = 8;
  int64 due_before_ms = 9; // 仅返回 deadline <= 该值（Unix ms）；0 = 不过滤
  // 多值过滤（与上面的单值字段叠加为 AND；空 = 不过滤）。任一命中即算匹配。
  // `PENDING` 不是席位状态取值，调用方要按 created|claimed|suspended|scheduled 展开
  // （轮次级读面的 `statuses` 同样如此）。
  repeated string statuses = 10;
  repeated string candidate_groups = 11;
}

message WorkflowListTasksResponse {
  repeated ApprovalTaskSummary tasks = 1;
  string next_page_token = 2;
}

message ApprovalTaskSummary {
  string instance_id = 1;
  string task_id = 2;
  string node = 3;
  string branch_id = 4;
  string round_id = 5;
  string kind = 6;
  string status = 7;
  string assignee = 8;
  repeated string candidates = 9;
  int64 deadline_ms = 10;
  int64 created_at_ms = 11;
  string origin = 12;
  string predecessor_task_id = 13;
  string successor_task_id = 14;
  string spawned_by_action_id = 15;
  repeated ApprovalAssignment assignments = 16;
  int64 updated_at_ms = 17; // 席位最近一次状态变更（Unix ms）
  int64 completed_at_ms = 18; // 终态时刻（Unix ms）；未终态为 0
}

message WorkflowGetTaskRequest {
  string task_id = 1;
}

message WorkflowGetTaskResponse {
  ApprovalTaskSummary task = 1;
  repeated ApprovalVote votes = 2;
  string instance_status = 3; // 大写实例状态（RUNNING/COMPLETED/REJECTED/...）
  // 同轮全部席位（含请求的席位本身），按 (created_at, id) 排序。调用方聚合
  // seedj `HumanTask` 时不需要再按实例 N+1 读详情。
  repeated ApprovalTaskSummary round_tasks = 4;
  ApprovalRound round = 5; // 所属轮次（计数与判定）
}

// 轮次级任务查询（seedj `HumanTask` = coord 的一个 round）。
message WorkflowListTaskGroupsRequest {
  int32 page_size = 1; // 本页返回的任务（轮次）数上限；一页严格 <= 该值
  string page_token = 2; // 不透明；定位到 (实例 id, 轮次 id)
  string instance_id = 3; // 只查该实例（不跨实例扫描，不分页）
  string assignee = 4; // 该轮任一席位可被该主体处理（责任人 / 候选池 / 被委派人）
  string completed_by = 5; // 该轮任一席位投过票的 actor
  repeated string candidate_groups = 6; // 该轮任一席位的候选池含其中任一主体
  string node = 7; // 节点（步骤）名
  repeated string statuses = 8; // 席位状态多值（created|claimed|suspended|scheduled|completed|rejected|cancelled|withdrawn|expired）
  int64 due_before_ms = 9; // 该轮任一未决席位的 deadline <= 该值（Unix ms）；0 = 不过滤
}

message WorkflowListTaskGroupsResponse {
  repeated ApprovalTaskGroup groups = 1;
  string next_page_token = 2;
}

// 同轮聚合视图：一个 `ApprovalTaskGroup` 对应 seedj 的一个 `HumanTask`。
message ApprovalTaskGroup {
  string id = 1; // = round_id（稳定；可直接作为 GetTask 的入参定位席位）
  string instance_id = 2;
  string branch_id = 3;
  string round_id = 4;
  string node = 5;
  // 轮次状态标签：open / suspended / scheduled / passed / rejected / superseded / cancelled。
  string status = 6;
  // 席位类型汇总：轮内任一审批席 ⇒ approval；全为阅签席 ⇒ read_ack。
  string kind = 7;
  repeated ApprovalTaskSummary tasks = 8; // 同轮全部席位，按 (created_at, id) 排序
  repeated ApprovalAssignment assignments = 9; // 跨席位 assignment 展开
  int64 created_at_ms = 10; // 轮次开启时间（Unix ms）
  int64 deadline_ms = 11; // 未决席位的最早 deadline（Unix ms）；0 = 无
}

message WorkflowHistoryRequest {
  string workflow_id = 1;
}

message WorkflowHistoryResponse {
  repeated WorkflowHistoryEvent events = 1;
}

// 历史事件（读模型投影）。`event_type` 为稳定的 UPPER_SNAKE 标签：
//   STEP_ENTERED / TASK_CREATED / TASK_COMPLETED / TASK_REJECTED /
//   TASK_ACKNOWLEDGED / TASK_EXPIRED / TASK_CANCELLED / TASK_URGED / TASK_CC /
//   TASK_WITHDRAWN / TASK_ASSIGNEE_REMOVED / TASK_ASSIGNMENT_SUSPENDED /
//   TASK_ASSIGNMENT_RESUMED / TASK_ASSIGNMENT_AUTO_CANCELLED /
//   TASK_ADD_ASSIGNEE_BEFORE / TASK_ADD_ASSIGNEE_AFTER /
//   TASK_AFTER_SPAWN_DISCARDED / DELEGATION_EXPIRED /
//   ROUND_OPENED / ROUND_PASSED / ROUND_REJECTED / ROUND_SUPERSEDED / ROUND_CANCELLED /
//   INSTANCE_STARTED / INSTANCE_ROLLED_BACK / INSTANCE_COMPLETED / INSTANCE_REJECTED /
//   INSTANCE_WITHDRAWN / INSTANCE_CANCELLED / INSTANCE_TERMINATED / INSTANCE_FAULTED /
//   INSTANCE_FAILED / INSTANCE_WAITING / INSTANCE_RESUMED。
// `task / assignment` 级事件按 coord 的席位模型投影（audit 记录驱动）。
message WorkflowHistoryEvent {
  string event_id = 1; // 确定性 id（同状态重复读取稳定）
  string event_type = 2;
  string instance_id = 3;
  string step_name = 4; // 节点名；实例级事件为空
  string task_id = 5; // 席位级事件填；其余为空
  // 触发该事件的客户端 action id（命令的 `idempotency_key`）；系统动作（超时/到期）
  // 与未提供键的命令为空。`TASK_REJECTED.attributes.rejectActionIds` 是该席位全部
  // 否决票的 action id 列表。
  string action_id = 6;
  int64 occurred_at = 7; // Unix ms
  string attributes_json = 8; // 事件属性（JSON 对象字符串）
}

// 实例审批详情查询。
message WorkflowGetInstanceDetailRequest {
  string workflow_id = 1;
}

message WorkflowGetInstanceDetailResponse {
  string instance_id = 1;
  string status = 2;
  string initiator = 3;
  int64 revision = 4; // 乐观并发守卫值（CAS）；每次状态变更 +1
  string definition_name = 5;
  repeated ApprovalBranch branches = 6;
  repeated ApprovalTask tasks = 7;
  repeated ApprovalRound rounds = 8;
  repeated ApprovalAudit audit = 9; // 管理动作审计（含 acting_service）
  // 实例启动时钉死的定义身份（`initiator` 见字段 3）。
  string definition_namespace = 10;
  string definition_version = 11;
  // 代 `initiator` 发起本实例的服务主体（Start `on_behalf_of`）；
  // 直接发起为空串。
  string acting_service = 12;
}

message ApprovalBranch {
  string id = 1;
  string node = 2;
  int32 attempt = 3;
  string status = 4;
  string join = 5;
  string reject = 6;
  repeated string round_ids = 7;
}

message ApprovalTask {
  string id = 1;
  string branch_id = 2;
  string round_id = 3;
  string kind = 4;
  string status = 5;
  string assignee = 6;
  repeated string candidates = 7;
  int64 deadline_ms = 8; // 超时阈值（Unix ms）；0 = 无超时
  repeated ApprovalVote votes = 9; // 投票记录（含 actor / on_behalf_of / acting_service）
  // 席位来源：original|before_added|after_added（seedj HumanTask.kind）。
  string origin = 10;
  // 前/后加签派生任务的前驱席位（触发加签的原席位）。
  string predecessor_task_id = 11;
  // 原席位的首个后加签派生席位。
  string successor_task_id = 12;
  // 触发派生任务的客户端 action id（对应 `WorkflowAddSignRequest.action_id`）。
  string spawned_by_action_id = 13;
  // assignment 级读面（原责任人 / 代理人 / 转办来源）。
  repeated ApprovalAssignment assignments = 14;
  int64 created_at_ms = 15; // 席位创建时间（Unix ms）
  int64 updated_at_ms = 16; // 席位最近一次状态变更（Unix ms）
  int64 completed_at_ms = 17; // 终态时刻（Unix ms）；未终态为 0
}

// assignment 读面：coord 的席位 + 委派/转办展开成 seedj 的 TaskAssignment。
message ApprovalAssignment {
  string principal = 1;
  // pending|scheduled|suspended|transferred|delegated|completed|rejected|cancelled|expired
  string status = 2;
  string resolved_reason = 3; // 终态原因（RULE_SATISFIED / DELEGATION_EXPIRED / WITHDRAWN / ...）
  ApprovalVote record = 4; // 该主体的投票记录（若有）
  int64 assigned_at_ms = 5; // 该主体获得席位的时间（Unix ms）
  int64 resolved_at_ms = 6; // 该主体 assignment 的终态时刻（Unix ms）；未终态为 0
}

// 投票记录：`actor` 是被代表用户（直接操作时即调用方）；`acting_service` 是代其执行的
// 服务主体（直接操作为空）；`on_behalf_of` 保留委派场景的「被代表人」语义。
message ApprovalVote {
  string round_id = 1;
  string decision = 2;
  string actor = 3;
  string on_behalf_of = 4;
  string comment = 5;
  int64 at_ms = 6;
  string acting_service = 7;
}

// 管理动作审计（加签 / 减签 / 驳回至节点 / 撤回 / 终止）。
message ApprovalAudit {
  int64 at_ms = 1;
  string action = 2;
  string branch_id = 3;
  string by = 4;
  string detail = 5;
  string acting_service = 6;
}

message ApprovalRound {
  string id = 1;
  string branch_id = 2;
  int32 number = 3;
  string status = 4;
  int32 total_count = 5;
  int32 completed_count = 6;
  int32 rejected_count = 7;
  // 判不通过原因：`any_reject` / `reject_threshold_reached` /
  // `sign_completion_unsatisfiable` / `on_exhausted`；未判不通过为空。
  string reject_reason = 8;
  int64 opened_at_ms = 9; // 轮次开启时间（Unix ms）
  int64 closed_at_ms = 10; // 轮次关闭时间（Unix ms）；未关闭为 0
}

