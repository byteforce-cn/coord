syntax = "proto3";

// ============================================================
// Coord 对外契约 — 缓存（能力承诺面，v1.2）
//
// 状态：COMMITTED（承诺中）｜ 目标日期：2026-12-31 ｜ 状态表：apis/contracts/STATUS.md
// wire 基线：coord-proto/src/proto/cache.proto 的 coord.cache.v1.Cache
//            （字段编号/类型逐项一致；迁移 = 机械式重挂载，禁止趁机改 wire）
//
// 验收口径与目标日期约定见 WHITEPAPER.md。
//
// 语义与边界（按 WHITEPAPER.md 的规则：不承诺的语义必须显式写出）
// ------------------------------------------------------------
//   - **单节点语义**：每个键的操作在本 agent 的本地 redb 内是原子的、持久的
//     （含 RPop 的原子出队）。
//   - **跨节点复制为 best-effort，且不承诺原子提交**：写路径的顺序是
//     「本地提交 → 推送 ISR → min_isr 校验」。因此当推送或 min_isr 校验失败时，
//     RPC 会返回错误，而**本地写入已经生效** —— 调用方**不能**把错误读作
//     "写入未发生"。幂等键使重试安全。
//   - **落后副本最终一致，但非同步**：心跳检测到落后会触发 Reconcile 拉取补齐，
//     故"Leader 在本地提交后、Follower 补齐前崩溃"只会造成**暂时**不一致。
//   - **分区 Leader 为静态分配，不承诺自动故障转移**：所有 agent 基于同一成员集合
//     算出同一个 Leader（显式配置优先，否则取成员中地址最小者）。代价是 Leader
//     失联时该分区**不可写**（fail-closed，不脑裂），恢复需运维介入。
//   - **容量上界（B-PL-3，已强制）**：默认 1GB（`max_size_bytes`，0 = 不限）。
//     数据面活跃字节记账 + 服务内 reaper 周期回收（TTL 过期清扫 + 超界按「最后
//     写入序」淘汰至界内）；**单条写自身超限直接拒绝**（`RESOURCE_EXHAUSTED`）。
//     **不承诺**：严格逐写上界（周期收敛，周期内可短暂超界）、真 LRU、记账覆盖
//     ISR 复制日志与 redb 页面开销、ISR 启用时的跨节点一致淘汰 —— 完整边界与
//     判据见 `docs/production/ops/boundaries.md` B-PL-3（单一归属）。
//   - **不承诺**：跨键事务、跨 agent 的线性一致读。
//   - **键空间操作（Keys / Clear）**：单次调用扫描有界；Keys 为**本节点视角**
//     的 best-effort 枚举；Clear 覆盖全部数据类型并按逻辑键前缀批式删除，
//     ISR 启用时经复制通道全域下发。键不得含 NUL 字节（见消息注释）。
// ============================================================

package coord.cache.v1;

option java_multiple_files = true;
option java_package = "cn.byteforce.coord.contracts.cache.v1";
option go_package = "github.com/byteforce/coord/apis/contracts/gen/go/coord/cache/v1;cachev1";

// ============================================================

service Cache {
  // String operations
  rpc Get(CacheGetRequest) returns (CacheGetResponse);
  rpc Set(CacheSetRequest) returns (CacheSetResponse);
  // 原子条件写：仅当 key 不存在（或已过期）时写入（SetNX）。
  rpc SetIfAbsent(CacheSetIfAbsentRequest) returns (CacheSetIfAbsentResponse);
  rpc Delete(CacheDeleteRequest) returns (CacheDeleteResponse);
  // Hash operations
  rpc HGet(CacheHGetRequest) returns (CacheHGetResponse);
  rpc HSet(CacheHSetRequest) returns (CacheHSetResponse);
  rpc HGetAll(CacheHGetAllRequest) returns (CacheHGetAllResponse);
  // List operations
  rpc LPush(CacheLPushRequest) returns (CacheLPushResponse);
  rpc LRange(CacheLRangeRequest) returns (CacheLRangeResponse);
  // 原子出队（单写事务，消除并发重复/丢失）
  rpc RPop(CacheRPopRequest) returns (CacheRPopResponse);
  rpc LLen(CacheLLenRequest) returns (CacheLLenResponse);
  // Set operations
  rpc SAdd(CacheSAddRequest) returns (CacheSAddResponse);
  rpc SMembers(CacheSMembersRequest) returns (CacheSMembersResponse);
  // 键空间操作（有界）：枚举 string 键 / 按前缀清理（全部数据类型）。
  rpc Keys(CacheKeysRequest) returns (CacheKeysResponse);
  rpc Clear(CacheClearRequest) returns (CacheClearResponse);
}

message CacheGetRequest {
  string key = 1;
}

message CacheGetResponse {
  bytes value = 1;
  bool found = 2;
}

message CacheSetRequest {
  string key = 1;
  bytes value = 2;
  int64 ttl_seconds = 3;
}

message CacheSetResponse {}

// 原子条件写（SetNX）：仅当 key 不存在或已过期时写入。
//   - 写入成功返回 written=true；否则不改动原有值/TTL，返回 written=false；
//   - TTL 仅在写入成功时生效；
//   - 单 agent：条件判定与写入在同一写事务内原子完成；
//   - ISR 启用：判定在 Leader 本地事务内完成，成功时经复制通道下发。
//     错误语义与 `Set` 相同（本地写入可能已生效）；重试 = **再次尝试获取**——
//     若首次实际已写入，重试返回 written=false（与 Redis SETNX 同口径），
//     调用方不得用 false 推断「未被本次调用写入」。
message CacheSetIfAbsentRequest {
  string key = 1;
  bytes value = 2;
  int64 ttl_seconds = 3;
}

message CacheSetIfAbsentResponse {
  bool written = 1;
}

message CacheDeleteRequest {
  string key = 1;
}

message CacheDeleteResponse {
  bool deleted = 1;
}

message CacheHGetRequest {
  string key = 1;
  string field = 2;
}

message CacheHGetResponse {
  bytes value = 1;
  bool found = 2;
}

message CacheHSetRequest {
  string key = 1;
  string field = 2;
  bytes value = 3;
}

message CacheHSetResponse {}

message CacheHGetAllRequest {
  string key = 1;
}

message CacheHGetAllResponse {
  map<string, bytes> fields = 1;
}

message CacheLPushRequest {
  string key = 1;
  bytes value = 2;
}

message CacheLPushResponse {
  int64 length = 1;
}

message CacheLRangeRequest {
  string key = 1;
  int64 start = 2;
  int64 stop = 3;
}

message CacheLRangeResponse {
  repeated bytes values = 1;
}

message CacheRPopRequest {
  string key = 1;
}

message CacheRPopResponse {
  bytes value = 1;
  bool found = 2;
}

message CacheLLenRequest {
  string key = 1;
}

message CacheLLenResponse {
  int64 length = 1;
}

message CacheSAddRequest {
  string key = 1;
  bytes member = 2;
}

message CacheSAddResponse {}

message CacheSMembersRequest {
  string key = 1;
}

message CacheSMembersResponse {
  repeated bytes members = 1;
}

// 键枚举（有界、游标分页）：按**逻辑键**前缀枚举 string 键，按键升序。
//   - limit：单页上限（0 = 服务端默认 1000；服务端另有上限封顶）；
//   - cursor：上一页的 next_cursor（空 = 从头开始）；next_cursor 为空 = 已到末尾；
//   - 单次调用扫描有界（不退化全表阻塞扫描）；ISR 下为**本节点视角**的
//     best-effort 结果（落后节点可能缺新键）；hash/list/set 的逻辑键不在本面枚举；
//   - 键不得包含 NUL（\x00）字节：含 NUL 的键不保证被枚举（存储编码用 NUL 作分隔）。
message CacheKeysRequest {
  string prefix = 1;
  int32 limit = 2;
  string cursor = 3;
}

message CacheKeysResponse {
  repeated string keys = 1;
  string next_cursor = 2;
}

// 按逻辑键前缀清理（string/hash/list/set **全部数据类型**）：命名空间清理 /
// 容量回收的管理路径。
//   - 无匹配 = 成功（空操作）；删除不可回滚（无归档副本）；
//   - 批式执行（单批有界，不退化全表阻塞事务）；与并发写的先后由到达顺序决定；
//   - ISR 启用：清理决定经复制通道全域下发（Follower 幂等应用）；
//   - 容量记账（B-PL-3）随删除同步扣减；
//   - 键不得包含 NUL（\x00）字节（同 Keys）。
message CacheClearRequest {
  string prefix = 1;
}

message CacheClearResponse {
  uint64 removed_entries = 1; // 被清理的物理行数（hash field / list 元素 / set 成员逐行计）
  uint64 bytes_reclaimed = 2; // 回收的活跃字节（记账口径，B-PL-3）
}

// ============================================================
// MQ — Message Queue (Data Plane)
