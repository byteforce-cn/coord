syntax = "proto3";

// ============================================================
// Coord 对外契约 — 消息队列（能力承诺面，v1.2）
//
// 状态：COMMITTED（承诺中）｜ 目标日期：2026-12-31 ｜ 状态表：apis/contracts/STATUS.md
// wire 基线：coord-proto/src/proto/mq.proto 的 coord.mq.v1.MQ
//            （字段编号/类型逐项一致；迁移 = 机械式重挂载，禁止趁机改 wire）
//
// 说明：wire 服务名保留实现原样 `MQ`（迁移只改 package，不改 service 名；
// 文档中曾出现的 `Mq` 写法系笔误，实际实现为 `MQ`）。
//
// 语义与边界（按 WHITEPAPER.md 的规则：不承诺的语义必须显式写出）
// ------------------------------------------------------------
//   - **容量上界（B-PL-4，已强制）**：默认 1GB（`max_size_bytes`，0 = 不限）。
//     消息与 DLQ 在 publish 入口同事务记账 ⇒ **逐写严格上界**：超界与单条超限的
//     publish 被拒绝 `RESOURCE_EXHAUSTED`（不静默丢历史，也不按最老分区截断）。
//     消息与 DLQ 由 reaper（默认 10s）按 topic 的 `retention_secs` 周期回收
//     （`0` = 不按时间回收）。**不承诺**：记账覆盖消费位点 / 幂等索引 / ISR 复制
//     日志；ISR 启用时各节点配额与回收为**本地行为** —— 完整边界与判据见
//     `docs/production/ops/boundaries.md` B-PL-4（单一归属）。
//
// Leader 与消费路由（G-MQ-1）
// ------------------------------------------------------------
//   - 分区（shard = topic 级）Leader 为**静态一致分配**（ISR 成员中地址最小者，
//     可显式覆盖），任意 agent 经 `GetTopicLeader` 可查；响应含 ISR 成员、
//     是否降级与分区数。
//   - 非 Leader 的写操作（`Publish` / `Ack` / `Subscribe` / `DeleteTopic`）返回
//     `FAILED_PRECONDITION`，并携带结构化 trailer `coord-leader-hint: <leader>`
//     （可编程判别，无需解析错误文案）。恢复步骤：`GetTopicLeader` 重解析 →
//     改发 Leader → 指数退避重试；Leader 不可达（连接失败 = `UNAVAILABLE`）时
//     等待其恢复，**不要**向非 Leader 重放写操作。
//   - `Poll` 可读任意 agent 的本地副本（含 Follower），不要求 Leader；
//     消费位点（`Ack` / `Subscribe` 自动提交）为 Leader 本地状态。
//
// 删除语义（G-MQ-4，`DeleteTopic`）
// ------------------------------------------------------------
//   - 删除为**管理路径**（能力门禁）：调用方应先停该 topic 的读写；删除进行中
//     到达的读写按「配置已删」语义返回 `NOT_FOUND`（不承诺与删除原子交错）。
//   - ISR 启用时删除必经复制通道全域下发（Follower 幂等应用）；删除后所有 agent
//     对该 topic 的读写返回 `NOT_FOUND`，同名重建 = 空 topic。
//   - 回收范围 = 消息 / DLQ / 消费位点 / 幂等索引 / next-offset 计数；
//     响应返回逐项实际删除计数，配额随之归还。

// 验收口径与目标日期约定见 WHITEPAPER.md。
// ============================================================

package coord.mq.v1;

option java_multiple_files = true;
option java_package = "cn.byteforce.coord.contracts.mq.v1";
option go_package = "github.com/byteforce/coord/apis/contracts/gen/go/coord/mq/v1;mqv1";

// ============================================================

service MQ {
  rpc CreateTopic(MqCreateTopicRequest) returns (MqCreateTopicResponse);

  // 发布消息。
  //
  // 语义承诺：
  //
  // ① 返回的 offset 是该 (topic, partition) 上本条消息的位置；
  // ② `idempotency_key` 非空时按 (topic, partition, key) 去重：同一 key 重复发布
  //    **不产生第二条消息**，且返回**首次**的 offset；key 为空/未设置 ⇒ 不做去重
  //    （每次发布都是新消息）。幂等索引与消息在**同一个写事务**内落盘 ⇒ 重启后
  //    去重依然成立。
  //
  // 注：这里刻意用 ①② 而不用 markdown 列表标记（`- `/`* `/`1.`）。proto 注释会被
  // prost **原样**写进生成代码的 doc comment，而 rustdoc 对“列表项续行缩进不足”
  // 会报 `doc list item without indentation`；本仓 CI 以 `-D warnings` 跑 clippy，
  // 于是契约里一个无害的排版选择会让整个 lint 校验失败。
  //
  // 边界（显式声明，不承诺的部分不写在这里就不算承诺）：本 RPC 只承诺
  // "消息已持久化到该 agent 的本地日志"；跨 agent 复制由 ISR 通道负责，
  // 其进度**不**在本 RPC 的返回值里体现；容量上界（B-PL-4）耗尽时返回
  // `RESOURCE_EXHAUSTED`（同事务记账的严格拒绝，不是事后淘汰）。
  rpc Publish(MqPublishRequest) returns (MqPublishResponse);

  // 流式推送订阅。
  //
  // **边界（按 WHITEPAPER.md 的边界声明规则显式声明）**：这是**推送**路径，
  // 为**best-effort**——订阅者 channel 打满（背压）时消息会被**丢弃**，
  // 丢弃不报错、不重投。**它不是 at-least-once 通道。**
  //
  // 需要 at-least-once 语义必须用 `Poll` + `Ack`（那是本服务唯一的承诺路径）。
  rpc Subscribe(MqSubscribeRequest) returns (stream MqMessage);

  // 提交消费组偏移（at-least-once 的游标）。
  //
  // 语义承诺：Ack 成功后，该 (topic, consumer_group, partition) 的已提交偏移
  // 前进到 `offset`，重启后从该偏移继续投递 ⇒ 不丢（可能重复投递）。
  // 复制启用时偏移为分区 Leader 本地状态，非 Leader 返回 FAILED_PRECONDITION。
  rpc Ack(MqAckRequest) returns (MqAckResponse);

  // 按 offset 增量拉取。
  //
  // 这是本服务的 **at-least-once 承诺路径**：`Poll` 拿到消息 → `Ack` 提交偏移。
  // 游标只在 Ack 成功后前进，因此"已确认的偏移越过某条消息而它从未被投递"即为
  // 静默丢失（违诺）。start_offset 取上次已 Ack 的位置即可获得最少重复的投递。
  rpc Poll(MqPollRequest) returns (MqPollResponse);

  // 读取死信队列（可选扩展：毒消息可观测）
  rpc PollDlq(MqPollDlqRequest) returns (MqPollDlqResponse);

  // 查询 topic 的 Leader 与 ISR 拓扑（任意 agent 可答；单 agent 时
  // `replication_enabled=false`、`leader_agent` 为空 = 调用方视本 agent 为 Leader）。
  rpc GetTopicLeader(MqGetTopicLeaderRequest) returns (MqGetTopicLeaderResponse);

  // 显式移入死信队列（管理路径，能力门禁 `coord:mq:manage`）。
  //
  // 语义：把 (topic, partition, offset) 的消息从主日志移入 DLQ（净额记账、
  // 分区不被阻塞），reason / detail 原样可读（`PollDlq` 可见）；消息或 topic
  // 不存在返回 `NOT_FOUND`。自动投毒判定（按重试次数 / 策略）不在承诺内。
  rpc MoveToDlq(MqMoveToDlqRequest) returns (MqMoveToDlqResponse);

  // 删除 topic 并回收全部存量（管理路径，能力门禁 `coord:mq:manage`）。
  //
  // 前置条件、ISR 全域一致性与删除后错误语义见头注「删除语义」。
  rpc DeleteTopic(MqDeleteTopicRequest) returns (MqDeleteTopicResponse);
}

message MqCreateTopicRequest {
  string topic = 1;
  int32 partitions = 2;
}

message MqCreateTopicResponse {}

message MqPublishRequest {
  string topic = 1;
  int32 partition = 2;
  bytes key = 3;
  bytes payload = 4;
  string idempotency_key = 5;
}

message MqPublishResponse {
  int64 offset = 1;
}

message MqSubscribeRequest {
  string topic = 1;
  string consumer_group = 2;
}

message MqMessage {
  string topic = 1;
  int32 partition = 2;
  int64 offset = 3;
  bytes key = 4;
  bytes payload = 5;
  int64 timestamp = 6;
  // DLQ 专用（仅 PollDlq 填充；普通消息为空）：移入原因 / 详情（G-MQ-2）
  string dlq_reason = 7;
  string dlq_detail = 8;
}

message MqAckRequest {
  string topic = 1;
  string consumer_group = 2;
  int32 partition = 3;
  int64 offset = 4;
}

message MqAckResponse {}

message MqPollRequest {
  string topic = 1;
  int32 partition = 2;
  string consumer_group = 3;
  int64 start_offset = 4;
  int32 max_count = 5;
}

message MqPollResponse {
  repeated MqMessage messages = 1;
}

message MqPollDlqRequest {
  string topic = 1;
  int32 partition = 2;
  int32 max_count = 3;
}

message MqPollDlqResponse {
  repeated MqMessage messages = 1;
}

message MqGetTopicLeaderRequest {
  string topic = 1;
}

message MqGetTopicLeaderResponse {
  string topic = 1;
  // Leader 的 agent 地址（host:port）；单 agent 部署为空（本 agent 即 Leader）
  string leader_agent = 2;
  // 当前 ISR 成员（含 Leader）；单 agent 部署为空
  repeated string isr_members = 3;
  // 是否启用 ISR 复制（false = 单 agent 本地语义）
  bool replication_enabled = 4;
  // ISR 是否不足（当前成员数 < min_isr；true 时写操作被拒绝）
  bool degraded = 5;
  int32 partitions = 6;
  // 生效的 min_isr（单 agent 自动降级为 1；未启用复制时为 0）
  uint64 min_isr = 7;
}

message MqMoveToDlqRequest {
  string topic = 1;
  int32 partition = 2;
  int64 offset = 3;
  // 可读的移入原因（如 "poison" / "decode_error"）
  string reason = 4;
  // 补充细节（自由文本，可为空）
  string detail = 5;
}

message MqMoveToDlqResponse {}

message MqDeleteTopicRequest {
  string topic = 1;
}

message MqDeleteTopicResponse {
  // 各表实际删除条目数（Leader 本地；Followers 幂等应用同一删除）
  uint64 messages_removed = 1;
  uint64 dlq_removed = 2;
  uint64 offsets_removed = 3;
  uint64 idempotency_removed = 4;
  // 回收的记账字节（消息 + DLQ 物理字节，与 B-PL-4 同口径）
  uint64 bytes_reclaimed = 5;
}

// ============================================================
// Replica — Agent↔Agent 数据复制 (ISR)
