syntax = "proto3";

// ============================================================
// Coord 对外契约 — PKI 证书签发（能力承诺面，v1.2）
//
// 状态：COMMITTED（承诺中）｜ 目标日期：2026-12-31 ｜ 状态表：apis/contracts/STATUS.md
// wire 基线：coord-proto/src/proto/pki.proto 的 coord.pki.v1.Pki
//            （字段编号/类型逐项一致）
//
// 私钥形态：ADR-0019 D6——coord 托管私钥，签发/续期/轮换响应**不再返回 `key_pem`**，
// 只返回 `key_material = {kind: coord_managed, key_name, key_version}`。私钥留在
// transit 命名密钥档案里（KEK 包裹），调用方通过 `coord.transit.v1` 的
// `Sign` / `Verify` 使用；唯一导出出口是 `Transit/ExportKey`（受
// `coord:transit:key_export` 约束，CA 密钥恒不可导出）。
// `GetCertByCN` 的私钥读取路径已删除——本响应只含证书与密钥引用，不含材料。
//
// 吊销面（ADR-0020）：`RevokeCert` / `GetCertStatus` / `GetCrl` / `RotateCrl` / `Tidy`。
// - 吊销是 CA 侧的**权威事实**：serial 一旦吊销永久保持 revoked（不因过期/重启/双实例而复活）；
//   `VerifyCert` 会查吊销账本，第三方验签方用 `GetCrl` 自己校验；
// - `IssueCert` / `SignCsr` 对「当前证书已吊销」的 CN 显式 `FAILED_PRECONDITION`，
//   不静默重签；`RotateCert` 是**显式**换新身份的路径（旧 serial 仍保持 revoked）；
// - CRL 只经 RPC 分发，coord 不提供 HTTP 端点；缓存与刷新节奏由消费方负责
//   （吊销生效延迟 = 消费方 TrustManager 的 CRL/KV 缓存窗口）。
//
// 验收口径与目标日期约定见 WHITEPAPER.md。
// ============================================================

package coord.pki.v1;

option java_multiple_files = true;
option java_package = "cn.byteforce.coord.contracts.pki.v1";
option go_package = "github.com/byteforce/coord/apis/contracts/gen/go/coord/pki/v1;pkiv1";

// ============================================================

// 证书用途 → 精确的 KU/EKU（IssueCert / RotateCert / SignCsr）。
// - SERVER: KU=digitalSignature|keyEncipherment, EKU=serverAuth
// - CLIENT: KU=digitalSignature, EKU=clientAuth
// - BOTH:   KU=digitalSignature|keyEncipherment, EKU=clientAuth+serverAuth
enum PkiCertificateUsage {
  // IssueCert / SignCsr: 按 BOTH；RotateCert: 继承当前证书的 usage（无记录时 BOTH）。
  PKI_CERTIFICATE_USAGE_UNSPECIFIED = 0;
  PKI_CERTIFICATE_USAGE_SERVER = 1;
  PKI_CERTIFICATE_USAGE_CLIENT = 2;
  PKI_CERTIFICATE_USAGE_BOTH = 3;
}

// RFC 5280 §5.3.1 CRLReason（数值与 RFC 逐项一致）。
// 与 seedj `PkiProvider.RevocationReason` 的子集对齐：UNSPECIFIED / KEY_COMPROMISE /
// CA_COMPROMISE / SUPERSEDED / CESSATION 是双方共有的取值。
enum PkiRevocationReason {
  PKI_REVOCATION_REASON_UNSPECIFIED = 0;
  PKI_REVOCATION_REASON_KEY_COMPROMISE = 1;
  PKI_REVOCATION_REASON_CA_COMPROMISE = 2;
  PKI_REVOCATION_REASON_AFFILIATION_CHANGED = 3;
  PKI_REVOCATION_REASON_SUPERSEDED = 4;
  PKI_REVOCATION_REASON_CESSATION_OF_OPERATION = 5;
  PKI_REVOCATION_REASON_CERTIFICATE_HOLD = 6;
  PKI_REVOCATION_REASON_PRIVILEGE_WITHDRAWN = 9;
  PKI_REVOCATION_REASON_AA_COMPROMISE = 10;
}

// CRL 编码：UNSPECIFIED = PEM。
enum PkiCrlFormat {
  PKI_CRL_FORMAT_UNSPECIFIED = 0;
  PKI_CRL_FORMAT_PEM = 1;
  PKI_CRL_FORMAT_DER = 2;
}

service Pki {
  rpc InitCa(PkiInitCaRequest) returns (PkiInitCaResponse);
  rpc IssueCert(PkiIssueCertRequest) returns (PkiIssueCertResponse);
  rpc RenewCert(PkiRenewCertRequest) returns (PkiRenewCertResponse);
  // 判据：有效期窗口 + issuer 与本 CA 一致 + CA 公钥验签 + **serial 未被吊销**。
  // PEM 无法解析 ⇒ INVALID_ARGUMENT；签名/有效期/吊销任一不通过 ⇒ valid=false。
  rpc VerifyCert(PkiVerifyCertRequest) returns (PkiVerifyCertResponse);
  rpc GetCaCert(PkiGetCaCertRequest) returns (PkiGetCaCertResponse);
  // ISSUE-000 Phase 2: 平滑轮换（按 CN 轮换 + 列表 + 幂等取回）
  rpc RotateCert(PkiRotateCertRequest) returns (PkiRotateCertResponse);
  rpc ListCerts(PkiListCertsRequest) returns (PkiListCertsResponse);
  rpc GetCertByCN(PkiGetCertByCNRequest) returns (PkiGetCertByCNResponse);
  // 按 serial 只读查询（含 retired / expired / revoked；不含私钥；能力 pki:cert:read）。
  // serial 按十六进制整数比较（`0abc…` 与 `abc…` 同一值：忽略大小写与前导零）。
  // 不存在 ⇒ NOT_FOUND；非 hex ⇒ INVALID_ARGUMENT。
  rpc GetCertBySerial(PkiGetCertBySerialRequest) returns (PkiGetCertBySerialResponse);
  // 用调用方 CSR 的公钥签发（proof-of-possession 必须通过）。私钥不进入 coord；
  // CN / SAN 取自 CSR；subject 的其他属性按 coord profile 固定。
  rpc SignCsr(PkiSignCsrRequest) returns (PkiSignCsrResponse);
  // 吊销（ADR-0020）：serial 接受 IssueCert/GetCertBySerial 返回的记录 serial，
  // 也接受证书内嵌的 X.509 serial；按十六进制整数比较（忽略大小写与前导零）。
  // 重复吊销幂等（保留首次的 reason/revoked_at/by）。
  // 未知 serial ⇒ NOT_FOUND；非 hex ⇒ INVALID_ARGUMENT。能力 pki:cert:revoke。
  rpc RevokeCert(PkiRevokeCertRequest) returns (PkiRevokeCertResponse);
  // 按 serial 查状态（active / retired / expired / revoked；未知 ⇒ NOT_FOUND）。
  // serial 按十六进制整数比较（忽略大小写与前导零）；非 hex ⇒ INVALID_ARGUMENT。
  // 能力 pki:cert:read。
  rpc GetCertStatus(PkiGetCertStatusRequest) returns (PkiGetCertStatusResponse);
  // 当前 CRL（CA 签名）。吊销集合变化、或 next_update 已过时分配新 CRL number
  // 并持久化；否则复用当前编号与时间窗口。能力 pki:cert:read。
  rpc GetCrl(PkiGetCrlRequest) returns (PkiGetCrlResponse);
  // 强制分配新 CRL number 并重签（即使吊销集合未变）。能力 pki:cert:revoke。
  rpc RotateCrl(PkiRotateCrlRequest) returns (PkiRotateCrlResponse);
  // 回收 `not_after + retention` 之前到期的证书历史/过期 active 记录。
  // **吊销记录不回收**（serial 的 revoked 状态是永久事实）。能力 pki:cert:revoke。
  rpc Tidy(PkiTidyRequest) returns (PkiTidyResponse);
}

message PkiInitCaRequest {
  string ca_common_name = 1;
}

message PkiInitCaResponse {}

message PkiIssueCertRequest {
  string common_name = 1;
  int64 ttl_seconds = 2; // 证书 TTL（秒），0 使用默认 24h
  // 证书 SAN。两者皆空 ⇒ 把 common_name 派生为 DNS SAN；CN 不是合法
  // DNS 名（非 ASCII 等）时返回 INVALID_ARGUMENT，不静默退回无 SAN。
  repeated string dns_names = 3;
  repeated string ip_addresses = 4;
  // 证书用途；未指定 = BOTH（保持既有 profile）。
  PkiCertificateUsage usage = 5;
}

// 私钥引用：材料本身留在 coord 的命名密钥档案中（ADR-0019 D6）。
// kind: coord_managed（key_name/key_version 指向 transit 档案）或 external
// （调用方自持私钥，key_name 为空、key_version=0）。
message PkiKeyMaterial {
  // 目前只有 "coord_managed"（Vault 形态的「密钥交付持有方」已删除）。
  string kind = 1;
  // transit 命名密钥名（pki/leaf/{cn}）
  string key_name = 2;
  // 签名/解密时使用的版本；0 = latest（证书签发时即固定，调用方应原样回传）
  uint32 key_version = 3;
}

message PkiIssueCertResponse {
  string common_name = 1;
  string cert_pem = 2;
  reserved 3; // 原 key_pem：ADR-0019 D6 删除（私钥不出 coord）
  int64 not_before = 4; // UNIX epoch seconds
  int64 not_after = 5; // UNIX epoch seconds
  string serial = 6; // hex-encoded（= 证书内嵌 serial）
  string status = 7; // active / retired / expired / revoked
  string parent_serial = 8; // 轮换链（首次签发为空）
  PkiKeyMaterial key_material = 9;
}

message PkiRenewCertRequest {
  // 要续期的证书序列号（hex-encoded；按整数比较，忽略大小写与前导零）
  string serial_number = 1;
  int64 ttl_seconds = 2; // 新证书的 TTL（秒），0 使用默认 24h
}

message PkiRenewCertResponse {
  string common_name = 1;
  string cert_pem = 2;
  reserved 3; // 原 key_pem：ADR-0019 D6 删除
  int64 not_before = 4;
  int64 not_after = 5;
  string serial = 6;
  string status = 7; // active / retired / expired / revoked
  string parent_serial = 8;
  PkiKeyMaterial key_material = 9;
}

// 按 CN 显式轮换：签发新 active，旧证书标记 retired 保留至 not_after
message PkiRotateCertRequest {
  string common_name = 1;
  int64 ttl_seconds = 2;
  // 证书 SAN。两者皆空 ⇒ 继承当前 active 证书的 SAN（无既有记录时由 CN 派生），
  // 避免「轮换后丢 SAN」。
  repeated string dns_names = 3;
  repeated string ip_addresses = 4;
  // 证书用途；未指定 = 继承当前证书（无既有记录时 BOTH）。
  PkiCertificateUsage usage = 5;
}

message PkiRotateCertResponse {
  string common_name = 1;
  string cert_pem = 2;
  reserved 3; // 原 key_pem：ADR-0019 D6 删除
  int64 not_before = 4;
  int64 not_after = 5;
  string serial = 6;
  string status = 7; // active / retired / expired / revoked
  string parent_serial = 8;
  PkiKeyMaterial key_material = 9;
}

// 按 CN 取当前 + 历史证书列表（验签方按 serial/kid 构建多密钥 JWKS）
message PkiListCertsRequest {
  string common_name = 1;
}

message PkiListCertsResponse {
  repeated PkiCertSummary certs = 1;
}

// 证书摘要：不含私钥（ListCerts 仅用于验签方构建公钥 JWKS）
message PkiCertSummary {
  string common_name = 1;
  string cert_pem = 2;
  int64 not_before = 3; // UNIX epoch seconds
  int64 not_after = 4; // UNIX epoch seconds
  string serial = 5; // hex-encoded
  string status = 6; // active / retired / expired / revoked
  string parent_serial = 7;
}

// 按 CN 幂等取回当前有效证书（**不含私钥**；私钥留在 coord，ADR-0019 D6）
message PkiGetCertByCNRequest {
  string common_name = 1;
}

message PkiGetCertByCNResponse {
  string common_name = 1;
  string cert_pem = 2;
  reserved 3; // 原 key_pem：ADR-0019 D6 删除（唯一出口 Transit/ExportKey）
  int64 not_before = 4;
  int64 not_after = 5;
  string serial = 6;
  string status = 7; // active / retired / expired / revoked
  string parent_serial = 8;
  PkiKeyMaterial key_material = 9;
}

// 按 serial 只读查询（含 retired / expired / revoked；不含私钥）
message PkiGetCertBySerialRequest {
  // hex-encoded；按整数比较（忽略大小写与前导零），响应回显定长 32 位。
  string serial = 1;
}

message PkiGetCertBySerialResponse {
  string common_name = 1;
  string cert_pem = 2;
  int64 not_before = 3; // UNIX epoch seconds
  int64 not_after = 4; // UNIX epoch seconds
  string serial = 5; // hex-encoded
  // active / retired / expired / revoked。expired 由服务端按 not_after 与当前时间
  // 判定，覆盖 active/retired 存储态；revoked 覆盖其余存储态（吊销是永久事实）。
  string status = 6;
  string parent_serial = 7;
}

// 用调用方 CSR 的公钥签发；CN / SAN 取自 CSR，私钥留在调用方。
message PkiSignCsrRequest {
  bytes csr_der = 1; // PKCS#10 DER
  int64 ttl_seconds = 2; // 0 使用默认 24h
  // 未指定 = BOTH。
  PkiCertificateUsage usage = 3;
}

message PkiSignCsrResponse {
  string common_name = 1;
  string cert_pem = 2;
  int64 not_before = 3; // UNIX epoch seconds
  int64 not_after = 4; // UNIX epoch seconds
  string serial = 5; // hex-encoded
  string status = 6; // active / retired / expired / revoked
  string parent_serial = 7;
}

message PkiVerifyCertRequest {
  string cert_pem = 1;
}

message PkiVerifyCertResponse {
  bool valid = 1;
}

message PkiGetCaCertRequest {}

message PkiGetCaCertResponse {
  string ca_cert_pem = 1;
}

// ──── 吊销面（ADR-0020）────

message PkiRevokeCertRequest {
  // 记录 serial（IssueCert 等响应）或证书内嵌的 X.509 serial，hex-encoded。
  // 按整数比较：忽略大小写与前导零（`0abc…` 与 `abc…` 同一值）。
  string serial = 1;
  // RFC 5280 CRLReason；未指定 = 0（unspecified）。
  PkiRevocationReason reason = 2;
}

message PkiRevokeCertResponse {
  // 请求时的 serial（原样回显）。
  string serial = 1;
  // 证书内嵌的 X.509 serial（CRL 条目口径）；无法解析时为记录 serial。定长 32 位 hex。
  string cert_serial = 2;
  string common_name = 3;
  string status = 4; // 恒为 revoked
  int64 revoked_at = 5; // UNIX epoch seconds
  PkiRevocationReason reason = 6;
  // 吊销执行者：服务端从鉴权主体取（CCT `sub`；无身份上下文时 `anonymous`），
  // 不接受调用方自报。
  string by = 7;
}

message PkiGetCertStatusRequest {
  // hex-encoded；按整数比较（忽略大小写与前导零）。
  string serial = 1;
}

message PkiGetCertStatusResponse {
  string serial = 1; // 请求的 serial（原样回显）
  // 证书内嵌的 X.509 serial（定长 32 位 hex；无法解析时为空）
  string cert_serial = 2;
  string common_name = 3;
  // active / retired / expired / revoked。被吊销时恒为 revoked（覆盖 expired）。
  string status = 4;
  int64 not_before = 5; // UNIX epoch seconds；仅吊销账本命中时为 0
  int64 not_after = 6; // UNIX epoch seconds；仅吊销账本命中时为 0
  // 以下字段仅 status=revoked 时非零/非空。
  int64 revoked_at = 7; // UNIX epoch seconds
  PkiRevocationReason reason = 8;
  string by = 9;
}

message PkiGetCrlRequest {
  PkiCrlFormat format = 1; // 未指定 = PEM
}

message PkiGetCrlResponse {
  bytes crl = 1; // 按 format 编码的 CRL
  PkiCrlFormat format = 2;
  uint64 crl_number = 3; // 单调递增（RFC 5280 §5.2.3）
  int64 this_update = 4; // UNIX epoch seconds
  int64 next_update = 5; // UNIX epoch seconds（消费方须在此之前刷新）
}

message PkiRotateCrlRequest {
  PkiCrlFormat format = 1; // 未指定 = PEM
}

message PkiRotateCrlResponse {
  bytes crl = 1;
  PkiCrlFormat format = 2;
  uint64 crl_number = 3;
  int64 this_update = 4;
  int64 next_update = 5;
}

message PkiTidyRequest {
  // 到期后保留多久（秒）；0 = 服务端默认（history_retention_hours）。
  int64 retention_seconds = 1;
}

message PkiTidyResponse {
  int64 retention_seconds = 1; // 本次生效的保留期
  uint64 removed_certs = 2; // 被回收的证书记录数（active + history）
}
