syntax = "proto3";

// ============================================================
// Coord 对外契约 — 分布式 ID 发号器（能力承诺面，v1.1）
//
// 状态：COMMITTED（承诺中）｜ GA 期限：2026-10-31 ｜ 台账：apis/contracts/STATUS.md
// wire 基线：coord-proto/src/proto/agent_api.proto 的 coord.agent.IdGen
//
// 语义契约（WHITEPAPER.md §3.4）：
//   - 同名发号器内 ID 全局唯一、趋势递增；
//   - 不承诺连续（并发跳号允许）与严格递增；
//   - 默认雪花算法（1 符号 + 41 毫秒 + 10 worker + 12 序列），
//     号段（segment）模式经 step 参数 opt-in；
//   - 与 Server 断连时，号段缓存内可继续发号（不承诺无限离线）。
// ============================================================

package coord.idgen.v1;

option java_multiple_files = true;
option java_package = "cn.byteforce.coord.contracts.idgen.v1";
option go_package = "github.com/byteforce/coord/apis/contracts/gen/go/coord/idgen/v1;idgenv1";

// 获取单个 ID。
message IdGenNextIdRequest {
  string name = 1; // 发号器命名空间；不同 name 之间不承诺唯一关系
  int64 step = 2;  // 号段步长（segment 模式 opt-in；默认雪花模式忽略）
}

message IdGenNextIdResponse {
  int64 id = 1;
}

// 批量获取 ID。语义承诺：返回 count 个互异 ID。
message IdGenNextBatchRequest {
  string name = 1;
  int32 count = 2; // 批量数量；服务端可设上限，超限 → INVALID_ARGUMENT
  int64 step = 3;  // 号段步长（同 NextId）
}

message IdGenNextBatchResponse {
  repeated int64 ids = 1;
}

// 分布式 ID 发号器。
service IdGen {
  rpc NextId(IdGenNextIdRequest) returns (IdGenNextIdResponse);
  rpc NextBatch(IdGenNextBatchRequest) returns (IdGenNextBatchResponse);
}
