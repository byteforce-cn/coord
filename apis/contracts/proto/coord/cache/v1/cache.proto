syntax = "proto3";

// ============================================================
// Coord 对外契约 — 缓存（能力承诺面，v1.2）
//
// 状态：COMMITTED（承诺中）｜ GA 期限：2026-12-31 ｜ 台账：apis/contracts/STATUS.md
// wire 基线：coord-proto/src/proto/cache.proto 的 coord.cache.v1.Cache
//            （字段编号/类型逐项一致；迁移 = 机械式重挂载，禁止趁机改 wire）
//
// GA 验收定义与倒逼机制见 WHITEPAPER.md §13。
//
// 语义与边界（WHITEPAPER §10 规则 4：不承诺的语义必须显式写出）
// ------------------------------------------------------------
//   - **单节点语义**：每个键的操作在本 agent 的本地 redb 内是原子的、持久的
//     （含 RPop 的原子出队）。
//   - **跨节点复制为 best-effort，且不承诺原子提交**：写路径的顺序是
//     「本地提交 → 推送 ISR → min_isr 校验」。因此当推送或 min_isr 校验失败时，
//     RPC 会返回错误，而**本地写入已经生效** —— 调用方**不能**把错误读作
//     "写入未发生"。幂等键使重试安全。
//   - **落后副本最终一致，但非同步**：心跳检测到落后会触发 Reconcile 拉取补齐，
//     故"Leader 在本地提交后、Follower 补齐前崩溃"只会造成**暂时**不一致。
//   - **分区 Leader 为静态分配，不承诺自动故障转移**：所有 agent 基于同一成员集合
//     算出同一个 Leader（显式配置优先，否则取成员中地址最小者）。代价是 Leader
//     失联时该分区**不可写**（fail-closed，不脑裂），恢复需运维介入。
//   - **不承诺**：跨键事务、跨 agent 的线性一致读、容量上限（`max_size` 类参数
//     当前不生效，见 `coord-agent/src/services/cache.rs` 的 `new()` 文档）。
// ============================================================

package coord.cache.v1;

option java_multiple_files = true;
option java_package = "cn.byteforce.coord.contracts.cache.v1";
option go_package = "github.com/byteforce/coord/apis/contracts/gen/go/coord/cache/v1;cachev1";

// ============================================================

service Cache {
  // String operations
  rpc Get(CacheGetRequest) returns (CacheGetResponse);
  rpc Set(CacheSetRequest) returns (CacheSetResponse);
  rpc Delete(CacheDeleteRequest) returns (CacheDeleteResponse);
  // Hash operations
  rpc HGet(CacheHGetRequest) returns (CacheHGetResponse);
  rpc HSet(CacheHSetRequest) returns (CacheHSetResponse);
  rpc HGetAll(CacheHGetAllRequest) returns (CacheHGetAllResponse);
  // List operations
  rpc LPush(CacheLPushRequest) returns (CacheLPushResponse);
  rpc LRange(CacheLRangeRequest) returns (CacheLRangeResponse);
  // 原子出队（单写事务，消除并发重复/丢失）
  rpc RPop(CacheRPopRequest) returns (CacheRPopResponse);
  rpc LLen(CacheLLenRequest) returns (CacheLLenResponse);
  // Set operations
  rpc SAdd(CacheSAddRequest) returns (CacheSAddResponse);
  rpc SMembers(CacheSMembersRequest) returns (CacheSMembersResponse);
}

message CacheGetRequest {
  string key = 1;
}

message CacheGetResponse {
  bytes value = 1;
  bool found = 2;
}

message CacheSetRequest {
  string key = 1;
  bytes value = 2;
  int64 ttl_seconds = 3;
}

message CacheSetResponse {}

message CacheDeleteRequest {
  string key = 1;
}

message CacheDeleteResponse {
  bool deleted = 1;
}

message CacheHGetRequest {
  string key = 1;
  string field = 2;
}

message CacheHGetResponse {
  bytes value = 1;
  bool found = 2;
}

message CacheHSetRequest {
  string key = 1;
  string field = 2;
  bytes value = 3;
}

message CacheHSetResponse {}

message CacheHGetAllRequest {
  string key = 1;
}

message CacheHGetAllResponse {
  map<string, bytes> fields = 1;
}

message CacheLPushRequest {
  string key = 1;
  bytes value = 2;
}

message CacheLPushResponse {
  int64 length = 1;
}

message CacheLRangeRequest {
  string key = 1;
  int64 start = 2;
  int64 stop = 3;
}

message CacheLRangeResponse {
  repeated bytes values = 1;
}

message CacheRPopRequest {
  string key = 1;
}

message CacheRPopResponse {
  bytes value = 1;
  bool found = 2;
}

message CacheLLenRequest {
  string key = 1;
}

message CacheLLenResponse {
  int64 length = 1;
}

message CacheSAddRequest {
  string key = 1;
  bytes member = 2;
}

message CacheSAddResponse {}

message CacheSMembersRequest {
  string key = 1;
}

message CacheSMembersResponse {
  repeated bytes members = 1;
}

// ============================================================
// MQ — Message Queue (Data Plane)
