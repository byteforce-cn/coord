syntax = "proto3";

// ============================================================
// Coord 对外契约 — 分布式调度（能力承诺面，v1.2）
//
// 状态：COMMITTED（承诺中）｜ 目标日期：2027-03-31 ｜ 状态表：apis/contracts/STATUS.md
// wire 基线：coord-proto/src/proto/scheduler.proto 的 coord.scheduler.v1.Scheduler
//            （字段编号/类型逐项一致；迁移 = 机械式重挂载，禁止趁机改 wire）
//
// 验收口径与目标日期约定见 WHITEPAPER.md。
// ============================================================

package coord.scheduler.v1;

option java_multiple_files = true;
option java_package = "cn.byteforce.coord.contracts.scheduler.v1";
option go_package = "github.com/byteforce/coord/apis/contracts/gen/go/coord/scheduler/v1;schedulerv1";

// ============================================================

service Scheduler {
  rpc RegisterJob(SchedulerRegisterJobRequest) returns (SchedulerRegisterJobResponse);
  rpc ClaimJob(SchedulerClaimJobRequest) returns (SchedulerClaimJobResponse);
  rpc Heartbeat(SchedulerHeartbeatRequest) returns (SchedulerHeartbeatResponse);
  rpc CompleteJob(SchedulerCompleteJobRequest) returns (SchedulerCompleteJobResponse);
  // 任务详情读取（含完成结果回读，G-SC-1 读取面）。
  rpc GetJob(SchedulerGetJobRequest) returns (SchedulerGetJobResponse);
}

message SchedulerRegisterJobRequest {
  string name = 1;
  string cron_expression = 2;
  bytes payload = 3;
}

message SchedulerRegisterJobResponse {
  string job_id = 1;
}

// 尝试认领任务。认领是**跨节点原子 CAS**：任何时刻至多一个调用方拿到某个任务。
//
// 三种“拿不到”的情形（未注册 / 已被他人持有 / 尚未到期）**统一**用
// `found = false` 表达（而不是错误码）—— 区分它们会把正常竞态误报成故障。
//
// 语义承诺：
//   - `found = true` ⇒ `job_id` 即**认领句柄**，也是 Heartbeat / CompleteJob 的凭据；
//   - `payload` 回传**注册时携带的 payload 原字节**（服务端不再丢弃它）；
//   - 认领带租约：既不续期也不完成 ⇒ 租约到期后任务可被重新认领（至少一次）。
message SchedulerClaimJobRequest {
  string name = 1;
}

message SchedulerClaimJobResponse {
  string job_id = 1;
  bytes payload = 2;
  bool found = 3;
}

// 续期认领租约。
//
// 边界声明：wire 无 worker 身份字段 ⇒ `job_id` 本身就是凭据。
// **句柄不再算数时本 RPC 返回 FAILED_PRECONDITION**（未注册 / 无认领 / 已释放或
// 已过期），而不是回一个空的 OK —— 后者会让调用方以为自己仍持有任务。
message SchedulerHeartbeatRequest {
  string job_id = 1;
}

message SchedulerHeartbeatResponse {}

// 标记任务完成，释放认领。`job_id` 即凭据（同 Heartbeat）。
//
// 边界声明（WHITEPAPER.md）：
//   - 无有效认领且任务尚未 Completed ⇒ `FAILED_PRECONDITION`；
//   - 已 Completed 的任务**幂等**：重复完成仍返回成功；
//   - `result` **随完成持久化**（G-SC-1：KV 任务记录，重启不丢）；
//     首个完成的 result 为准（重复完成不覆盖）；结果经 `GetJob` 回读。
message SchedulerCompleteJobRequest {
  string job_id = 1;
  bytes result = 2;
}

message SchedulerCompleteJobResponse {}

// 读取任务详情（含完成结果回读）。
//
// 语义：
//   - 只读、幂等；任务未注册 ⇒ `found=false`（不是错误码）；
//   - `state` ∈ {"Pending","Running","Completed","Failed"}；
//   - `result`：完成后持久化的结果字节（首个完成为准）；非 Completed 时为空；
//   - `completed_at_ms`：完成墙钟毫秒（自 UNIX_EPOCH）；未完成时为 0。
//   - 重启 / 换 agent 后结果仍可读（状态在 Server KV，跨节点共享）。
message SchedulerGetJobRequest {
  string job_id = 1; // 注册返回的 job_id（= 注册名）
}

message SchedulerGetJobResponse {
  bool found = 1;
  string job_id = 2;
  string state = 3;
  bytes result = 4;
  int64 completed_at_ms = 5;
}

// ============================================================
// Workflow — Serverless Workflow
