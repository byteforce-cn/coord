# cargo-deny 配置（依赖治理，`.github/workflows/ci.yml` security-audit job）
#
# 维护约定：
# 新增依赖 PR 若触发 deny，必须：ADR/说明 → 更新本文件 allow 列表 → 合并。

[advisories]
# 漏洞通告：拒绝有已知漏洞的版本（默认行为）
yanked = "deny"
# 「无人维护」与「健全性」通告：显式声明为 all（而不是依赖 cargo-deny 的默认值），
# 因为它们是**依赖治理的有效信号**，不该随工具版本变化而悄悄改变。
unmaintained = "all"
unsound = "all"

# 例外：当前**无豁免条目**——唯一的 RUSTSEC-2025-0141 / bincode 豁免已随退场计划
# 关闭（bincode 已从依赖图消失，见 docs/production/ops/dependencies.md）；
# 重新引入 bincode 将直接 fail-closed。
#
# 维护约定：`ignore` 只允许按「一个通告 + 一段理由 + 一条关闭路径」的形式增长；
# 新增条目必须同时登记到退场计划文档。
ignore = []

[licenses]
# 默认拒绝未明确列出的许可证；coord 依赖栈常用许可白名单
#
# wasmtime（48.x）采用 `Apache-2.0 WITH LLVM-exception` 这个 SPDX 表达式
# （Apache-2.0 附加 LLVM 例外，允许与 Apache-2.0 代码链接），与既有 Apache-2.0
# 白名单语义兼容；引入 wasmtime 前需在 `coord-agent/Cargo.toml` 的 `plugin-wasm`
# feature 下显式声明依赖。
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    # 以下两个许可证必须列入白名单：`borrow-or-share`（MIT-0）与 `webpki-roots`
    # （CDLA-Permissive-2.0），都是宽松许可、与 MIT/Apache-2.0 兼容。
    # 缺任何一条，`cargo deny` 的 licenses 检查会在**任何**提交上失败。
    "MIT-0",
    "CDLA-Permissive-2.0",
]
exceptions = []

[bans]
# `wildcards = "deny"` 的前提：全部内部依赖都写 `version`（见根 `Cargo.toml` 的
# `[workspace.dependencies]`）。保持 `deny`：新增无版本内部依赖应当被拦截，
# 而不是降级为警告。
multiple-versions = "warn"
wildcards = "deny"
deny = []
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
