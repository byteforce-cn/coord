# cargo-deny 配置（依赖治理，`.github/workflows/ci.yml` security-audit job）
#
# 维护约定：
# 新增依赖 PR 若触发 deny，必须：ADR/说明 → 更新本文件 allow 列表 → 合并。

[advisories]
# 漏洞通告：拒绝有已知漏洞的版本（默认行为）
yanked = "deny"
# 「无人维护」与「健全性」通告：显式声明为 all（而不是依赖 cargo-deny 的默认值），
# 因为它们是**依赖治理的有效信号**，不该随工具版本变化而悄悄改变。
unmaintained = "all"
unsound = "all"

# 例外：只允许下面这一条，且必须写明理由与关闭路径。
#
# RUSTSEC-2025-0141 —— bincode 1.3.3 被标记为 **unmaintained**（**不是漏洞**）。
# 背景：bincode 团队因骚扰事件永久停止开发，并声明 1.3.3 是"完整版"。
# 该通告 `Solution: No safe upgrade is available!`，也没有 CVE。
#
# 为什么这里选择「记录后豁免」而不是「升级/替换」：
#   bincode 在本仓库不是可有可无的工具库，而是**持久化格式**，直接承载
#   · 快照（storage/snapshot.rs，且保留 SnapshotDataV1/V2/V3 三代格式的向后兼容解码）、
#   · Raft 日志条目（coord-core/src/workflow/raft_store.rs）、
#   · auth 用户/角色/会话/吊销记录（auth/manager.rs，`/_sys/auth/` 原生 bincode，
#     变体索引即变体号，见 `test_auth_op_bincode_variant_indices_appended`）、
#   · PD Region 元数据（pd/meta_store.rs）、
#   · 对象存储 manifest（storage/object_store.rs）、
#   · `AppliedLogId` 的**旧编码回退路径**（storage/mvcc.rs，专门为兼容旧 bincode 编码而保留）。
#   切换格式（postcard / wincode / rkyv…）是一次**跨版本数据迁移**，需要新旧格式双向
#   兼容窗口 + 迁移期，属于独立立项的工作；在 0.1.0 这种"还没有任何生产部署"的节点上
#   强行替换，风险远大于收益，而且会破坏代码里刻意维持的历史兼容分支。
#
# 结论：这是一条**信息性**通告（无漏洞、无可用升级），豁免是正确处理方式；
# 但"换成维护中的序列化格式"是**真实的技术债**，已记入
# docs/production/remaining-known-gaps.md，不允许静默遗忘。
#
# 维护约定：`ignore` 只允许按「一个通告 + 一段理由 + 一条关闭路径」的形式增长；
# 新增条目必须同时更新上面那份 gap 文档。
ignore = [
    { id = "RUSTSEC-2025-0141", reason = "bincode 1.3.3 为 unmaintained（非漏洞，且无可用升级）。它是本仓库的持久化格式（快照/Raft 日志/auth 记录/PD 元数据/对象清单），替换属于跨版本数据迁移，已在 docs/production/remaining-known-gaps.md 立项跟踪。" },
]

[licenses]
# 默认拒绝未明确列出的许可证；coord 依赖栈常用许可白名单
#
# ADR（2026-09-11）：`Apache-2.0 WITH LLVM-exception` —— wasmtime（48.x）
# 采用该 SPDX 表达式（Apache-2.0 附加 LLVM 例外，允许与 Apache-2.0 代码链接）。
# 与既有 Apache-2.0 白名单语义兼容，仅放宽该组合表达式；引入 wasmtime 前
# 需在 `coord-agent/Cargo.toml` 的 `plugin-wasm` feature 下显式声明依赖。
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    # 第四轮 §3.9⑤：以下两个此前未列入白名单，导致 `cargo deny` 的 licenses
    # 检查在**任何**提交上都失败（`borrow-or-share` 为 MIT-0、`webpki-roots`
    # 为 CDLA-Permissive-2.0）。两者都是宽松许可，与 MIT/Apache-2.0 兼容。
    "MIT-0",
    "CDLA-Permissive-2.0",
]
exceptions = []

[bans]
# 第四轮 §3.9⑤：内部依赖此前只写 `path`、不写 `version`，而这里设的是
# `wildcards = "deny"` → 27 条 `error[wildcard]`。已给全部内部依赖补上
# `version`（见根 `Cargo.toml` 的 `[workspace.dependencies]`），因此这里保持
# `deny`：新增无版本内部依赖应当被拦截，而不是降级为警告。
multiple-versions = "warn"
wildcards = "deny"
deny = []
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
