# cargo-deny 配置（依赖治理，`.github/workflows/ci.yml` security-audit job）
#
# 维护约定：
# 新增依赖 PR 若触发 deny，必须：ADR/说明 → 更新本文件 allow 列表 → 合并。

[advisories]
# 漏洞通告：拒绝有已知漏洞的版本（默认行为）
yanked = "deny"
ignore = []

[licenses]
# 默认拒绝未明确列出的许可证；coord 依赖栈常用许可白名单
#
# ADR（2026-09-11）：`Apache-2.0 WITH LLVM-exception` —— wasmtime（48.x）
# 采用该 SPDX 表达式（Apache-2.0 附加 LLVM 例外，允许与 Apache-2.0 代码链接）。
# 与既有 Apache-2.0 白名单语义兼容，仅放宽该组合表达式；引入 wasmtime 前
# 需在 `coord-agent/Cargo.toml` 的 `plugin-wasm` feature 下显式声明依赖。
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    # 第四轮 §3.9⑤：以下两个此前未列入白名单，导致 `cargo deny` 的 licenses
    # 检查在**任何**提交上都失败（`borrow-or-share` 为 MIT-0、`webpki-roots`
    # 为 CDLA-Permissive-2.0）。两者都是宽松许可，与 MIT/Apache-2.0 兼容。
    "MIT-0",
    "CDLA-Permissive-2.0",
]
exceptions = []

[bans]
# 第四轮 §3.9⑤：内部依赖此前只写 `path`、不写 `version`，而这里设的是
# `wildcards = "deny"` → 27 条 `error[wildcard]`。已给全部内部依赖补上
# `version`（见根 `Cargo.toml` 的 `[workspace.dependencies]`），因此这里保持
# `deny`：新增无版本内部依赖应当被拦截，而不是降级为警告。
multiple-versions = "warn"
wildcards = "deny"
deny = []
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
