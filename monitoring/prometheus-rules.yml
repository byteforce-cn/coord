# coord-server Prometheus 告警规则
#
# 覆盖：leader 切换、磁盘水位、慢 follower（apply 落后）、watch 背压、
# 鉴权拒绝风暴、Seal 状态异常。指标命名见 coord-server/src/metrics.rs。
#
# **每条告警都必须有 `runbook_url`** —— 告警不带处置入口等于把「知道出事了」
# 和「知道怎么办」之间的那一段留给人。锚点与
# `docs/production/ops/runbook.md` 的告警处置小节标题一一对应；
# `bash scripts/check-gate-drills.sh` 会校验 URL 里的锚点在 runbook 中真实存在。
groups:
  - name: coord-consensus
    rules:
      # Leader 切换：3 分钟内 leader id 变化次数 ≥ 2 → 可能选举风暴
      - alert: CoordLeaderChurn
        expr: |
          sum(changes(raft_leader_id{job=~"coord.*"}[3m])) by (instance) >= 2
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "coord 节点 {{ $labels.instance }} 3 分钟内 leader 变化 {{ $value }} 次"
          runbook_url: "https://github.com/byteforce-cn/coord/blob/main/docs/production/ops/runbook.md#coordleaderchurn--3-分钟内-leader-变化--2-次"

      # 慢 follower：apply 落后 commit 超过 1000 条且持续 5 分钟
      - alert: CoordFollowerApplyLag
        expr: |
          (raft_commit_index - raft_applied_index) > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "coord 节点 {{ $labels.instance }} apply 落后 commit {{ $value }} 条"
          runbook_url: "https://github.com/byteforce-cn/coord/blob/main/docs/production/ops/runbook.md#coordfollowerapplylag--follower-apply-落后-commit--1000-且持续-5m"

      # 无 leader 时间过长：整个集群 60s 无任何 leader
      - alert: CoordNoLeader
        expr: |
          count(raft_leader_id{job=~"coord.*"} > 0) == 0
        for: 60s
        labels:
          severity: critical
        annotations:
          summary: "coord 集群 60 秒无 leader（可能网络分区或选举故障）"
          runbook_url: "https://github.com/byteforce-cn/coord/blob/main/docs/production/ops/runbook.md#coordnoleader--集群-60s-无-leader"

  - name: coord-storage
    rules:
      # 磁盘水位：可用率低于 15%（对应 storage.disk_warn_ratio 默认 0.85 使用率）
      - alert: CoordDiskWatermarkHigh
        expr: |
          (disk_available_bytes / disk_total_bytes) < 0.15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "coord 节点 {{ $labels.instance }} 磁盘可用率仅 {{ $value | humanizePercentage }}"
          runbook_url: "https://github.com/byteforce-cn/coord/blob/main/docs/production/ops/runbook.md#coorddiskwatermarkhigh--coorddiskwatermarkcritical"

      # 磁盘水位临界：可用率低于 5%（逼近 readonly 闸）
      - alert: CoordDiskWatermarkCritical
        expr: |
          (disk_available_bytes / disk_total_bytes) < 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "coord 节点 {{ $labels.instance }} 磁盘可用率仅 {{ $value | humanizePercentage }}，即将触发只读闸"
          runbook_url: "https://github.com/byteforce-cn/coord/blob/main/docs/production/ops/runbook.md#coorddiskwatermarkhigh--coorddiskwatermarkcritical"

  - name: coord-service
    rules:
      # watch 背压丢弃率过高：近 5 分钟丢弃事件数超过下发数的 10%
      - alert: CoordWatchBackpressure
        expr: |
          rate(coord_watch_dropped_total[5m]) > 0.1 * rate(coord_watch_events_total[5m])
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "coord 节点 {{ $labels.instance }} watch 事件丢弃率异常（背压）"
          runbook_url: "https://github.com/byteforce-cn/coord/blob/main/docs/production/ops/runbook.md#coordwatchbackpressure--watch-丢弃率--10"

      # 鉴权拒绝风暴：5 分钟内拒绝数 > 100
      - alert: CoordAuthDeniedStorm
        expr: |
          rate(coord_auth_denied_total[5m]) > 20
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "coord 节点 {{ $labels.instance }} 鉴权拒绝率异常（可能被扫描/爆破）"
          runbook_url: "https://github.com/byteforce-cn/coord/blob/main/docs/production/ops/runbook.md#coordauthdeniedstorm--鉴权拒绝率异常"

      # Seal 状态：节点处于 sealed 但仍在提供读写（配置错误信号）
      - alert: CoordSealedNodeServing
        expr: |
          seal_status == 2 and grpc_requests_total{method="put"} > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "coord 节点 {{ $labels.instance }} 处于 sealed 状态仍有写入流量"
          runbook_url: "https://github.com/byteforce-cn/coord/blob/main/docs/production/ops/runbook.md#coordsealednodeserving--sealed-仍在写"

  - name: coord-agent-plugin
    rules:
      # 插件沙箱 trap：任一插件持续 trap（wasm fuel/epoch/memory 或 JS timeout）
      - alert: CoordPluginTrap
        expr: |
          sum by (instance, plugin, reason) (rate(coord_agent_plugin_traps_total[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "coord-agent {{ $labels.instance }} 插件 {{ $labels.plugin }} 持续 trap（reason={{ $labels.reason }}）"
          runbook_url: "https://github.com/byteforce-cn/coord/blob/main/docs/production/ops/runbook.md#coordplugintrap--coordpluginloadfailure--coordplugininvocationerrorrate"

      # 插件加载 / 启动失败：15 分钟内出现即告警（清单/实例化/资源上限配置错误）
      - alert: CoordPluginLoadFailure
        expr: |
          sum by (instance, plugin) (increase(coord_agent_plugin_load_failures_total[15m])) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "coord-agent {{ $labels.instance }} 插件 {{ $labels.plugin }} 加载/启动失败 {{ $value }} 次"
          runbook_url: "https://github.com/byteforce-cn/coord/blob/main/docs/production/ops/runbook.md#coordplugintrap--coordpluginloadfailure--coordplugininvocationerrorrate"

      # 插件调用错误率：错误占比 > 20% 且样本量足够（> 0.1 req/s）
      - alert: CoordPluginInvocationErrorRate
        expr: |
          (sum by (instance) (rate(coord_agent_plugin_invocations_total{outcome!="ok"}[5m]))
           / clamp_min(sum by (instance) (rate(coord_agent_plugin_invocations_total[5m])), 0.001)) > 0.2
          and sum by (instance) (rate(coord_agent_plugin_invocations_total[5m])) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "coord-agent {{ $labels.instance }} 插件调用错误率 {{ $value | humanizePercentage }}"
          runbook_url: "https://github.com/byteforce-cn/coord/blob/main/docs/production/ops/runbook.md#coordplugintrap--coordpluginloadfailure--coordplugininvocationerrorrate"

  - name: coord-supervision
    rules:
      # **唯一的监督出口**。受监督的后台任务（时间轮、快照调度、
      # 对象 GC、PD 执行器、auth 维护……）意外结束 = 对应能力静默死亡。
      #
      # `dead_tasks()` 必须接上监控面（只在测试里被读 = 没有消费者），所以
      # "某项后台能力已经死了"在监控面上完全不可见，只能靠翻 ERROR 日志。
      # 现在由 coord-server 的 /metrics 暴露（见 metrics.rs 的 render_prometheus_text）。
      #
      # 任何一项 > 0 都值得看：severity=critical 是因为本仓库的取舍是"不自动重启"
      # （任务持有不可重建的本地状态），所以死亡是**终态**，必须人工介入。
      - alert: CoordBackgroundTaskDead
        expr: |
          coord_dead_background_tasks{job=~"coord.*"} > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "coord {{ $labels.instance }} 有 {{ $value }} 个受监督后台任务已死亡（对应能力已失效，不会自愈）"
          runbook_url: "https://github.com/byteforce-cn/coord/blob/main/docs/production/ops/runbook.md#coordbackgroundtaskdead--受监督后台任务死亡"
          description: |
            任务名见 coord_dead_background_task_info{task=...}，或 GET /health?verbose=true
            的 dead_background_tasks 字段。本仓库不做自动重启（任务持有不可重建的本地
            状态），需人工判断后重启进程。

      # 「能力死亡必须可观测」的 agent 面。
      #
      # coord-core 的工作流运行时**没有 supervisor、没有 tracing**，所以它的两个长活
      # 形态死亡时**不得**没有任何出口：
      #   * 循环型 worker（子流程扫描器）：正常行为是永不结束 ⇒ "已结束"本身就是缺陷；
      #   * 一次性 worker（每个实例的 `drive`）：正常结束是**预期**行为，只有
      #     "结束了但没跑到最后一行"（panic/abort）才是缺陷。
      #
      # 两者在 agent 侧分别暴露为
      #   coord_agent_workflow_loops_finished（>0 = 循环死了）
      #   coord_agent_workflow_worker_faults_total（counter：未正常收尾的累计次数）
      #
      # 后果：`drive` 死亡 ⇒ 该实例**永久停在非终态且没有驱动者**
      # （"静默泄漏"形态：没有路径会告诉你）。
      - alert: CoordAgentWorkflowWorkerFault
        expr: |
          increase(coord_agent_workflow_worker_faults_total{job=~"coord.*"}[10m]) > 0
          or coord_agent_workflow_loops_finished{job=~"coord.*"} > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "coord-agent {{ $labels.instance }} 有工作流后台 worker 死亡（实例可能永久停在非终态）"
          runbook_url: "https://github.com/byteforce-cn/coord/blob/main/docs/production/ops/runbook.md#coordagentworkflowworkerfault--工作流后台-worker-死亡"
          description: |
            具体实例/任务名见 agent 的 ERROR 日志（同一指标首次变化时会打一条
            workflow background worker died without completing）与
            coord_agent_workflow_workers_live 的变化。
            处置：先确认受影响的实例清单（workflow ListInstances 里长期 Running 的项），
            再按 runbook 重启 agent 进程并用 `Workflow/Start` 之外的 resume 路径恢复。

  - name: coord-agent-dataplane
    rules:
      # MQ 消费组滞后（G-MQ-3）：单消费组在单 topic 上滞后 > 1000 条且持续 10
      # 分钟。lag = next_offset - committed_offset（同分区上下文，下限 0），
      # 逐 (topic, group, partition) 暴露，此处取各分区最大。
      - alert: CoordMqConsumerLag
        expr: |
          max by (instance, topic, group) (coord_agent_mq_consumer_lag{job=~"coord.*"}) > 1000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "coord-agent {{ $labels.instance }} 消费组 {{ $labels.group }} 在 topic {{ $labels.topic }} 滞后 {{ $value }} 条"
          runbook_url: "https://github.com/byteforce-cn/coord/blob/main/docs/production/ops/runbook.md#coordmqconsumerlag--mq-消费组滞后"
          description: |
            消费进度查询：coord_agent_mq_consumer_offset{...} 与
            coord_agent_mq_next_offset{topic,partition}。持续增长 = 消费能力跟不上
            生产（扩容消费者 / 检查消费者错误率）；停滞但 lag>0 = 消费者已停摆。

      # PKI 即将到期（G-PKI-2）：告警窗口（coord_agent_pki_expiry_warn_window_hours，
      # 默认 6h）内存在即将到期的 active 证书。
      - alert: CoordPkiCertExpiringSoon
        expr: |
          coord_agent_pki_certs_expiring_soon{job=~"coord.*"} > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "coord-agent {{ $labels.instance }} 有 {{ $value }} 张证书将在告警窗口内到期"
          runbook_url: "https://github.com/byteforce-cn/coord/blob/main/docs/production/ops/runbook.md#coordpkicertexpiringsoon--pki-证书即将到期"
          description: |
            窗口小时数见 coord_agent_pki_expiry_warn_window_hours；active 证书总数见
            coord_agent_pki_certs_active。到期 = 换新触发：调 RotateCert/RenewCert
            换新即可（见 runbook 小节）。

  - name: coord-kv-t
    rules:
      # TSO 客户端补发失败：本地批次耗尽后向 region 0 取新批失败（非 leader /
      # 不可达）。v2 写/事务拿不到时间戳。
      - alert: CoordKvTTsoRefillFailures
        expr: |
          increase(coord_tso_refill_failures_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "coord 节点 {{ $labels.instance }} TSO 批次补发失败（5m 增加 {{ $value }} 次）"
          runbook_url: "https://github.com/byteforce-cn/coord/blob/main/docs/production/ops/runbook.md#coordkvttsorefillfailures--tso-批次补发失败"
          description: |
            TSO 客户端只在本地批次耗尽时补发；失败说明 region 0 raft 不是 leader
            或不可达。看 coord_tso_batch_remaining 与 region 0 leader。

      # TSO leader 抖动：客户端观察到 region 0 领导权反复丢失。
      - alert: CoordKvTTsoLeaderChurn
        expr: |
          increase(coord_tso_leader_changes_total[10m]) >= 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "coord 节点 {{ $labels.instance }} 10 分钟内 TSO leader 变化 {{ $value }} 次"
          runbook_url: "https://github.com/byteforce-cn/coord/blob/main/docs/production/ops/runbook.md#coordkvttsoleaderchurn--tso-leader-频繁切换"
          description: |
            region 0 是 TSO 与 Region 元数据的权威组；持续换主会让批次补发停顿、
            已发放但未提交的时间戳被新 leader 的 fence 拒绝。

      # Sequencer 单事务校验成本：validation_us / txns > 50ms（5m rate）。
      - alert: CoordKvTSequencerValidationSlow
        expr: |
          rate(coord_kvt_sequencer_validation_us_total[5m])
            / clamp_min(rate(coord_kvt_sequencer_txns_total[5m]), 0.001) > 50000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "coord 节点 {{ $labels.instance }} 单事务校验耗时 {{ $value | humanize }}us"
          runbook_url: "https://github.com/byteforce-cn/coord/blob/main/docs/production/ops/runbook.md#coordkvtsequencervalidationslow--sequencer-单事务校验--50ms"
          description: |
            Commit Sequencer 是单 Raft 组（ADR-0015 D4）：校验成本上升直接压低
            全局提交吞吐。先看冲突率与读集大小，不要把它当成分片扩容问题。

      # OCC 冲突率 > 50%：热 key / write skew / 大范围读集。
      - alert: CoordKvTSequencerConflictStorm
        expr: |
          rate(coord_kvt_sequencer_conflicts_total[5m])
            / clamp_min(rate(coord_kvt_sequencer_txns_total[5m]), 0.001) > 0.5
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "coord 节点 {{ $labels.instance }} OCC 冲突率 {{ $value | humanizePercentage }}"
          runbook_url: "https://github.com/byteforce-cn/coord/blob/main/docs/production/ops/runbook.md#coordkvtsequencerconflictstorm--occ-冲突率--50"
          description: |
            冲突是 TXN_CONFLICT 业务结果（不是服务端错误）；持续高冲突说明
            访问模式在争同一批 key，客户端重试会进一步放大。

      # Commit Watermark 停滞：shard 在 seal 超时窗口内仍未被 watermark 越过。
      - alert: CoordKvTWatermarkStall
        expr: |
          increase(coord_kv_t_commit_watermark_stalls_total[10m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "coord 节点 {{ $labels.instance }} Commit Watermark 停滞（10m 内 {{ $value }} 次 seal 超时）"
          runbook_url: "https://github.com/byteforce-cn/coord/blob/main/docs/production/ops/runbook.md#coordkvtwatermarkstall--commit-watermark-停滞"
          description: |
            watermark = min(in-flight commit_ts) - 1（D9）。有 in-flight 提交迟迟
            不结束，shard 就无法 seal，Watch 只能看到 watermark 之前的事件。

      # Commit Log shard 数量异常：默认 1M 条 / 1h 先到先 seal，24h 保留窗口下
      # 稳态约 24 个 shard；长期远高于此说明 GC/回收停滞（容量风险）。
      - alert: CoordKvTCommitLogShardsHigh
        expr: |
          coord_kv_t_commit_log_shards > 100
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "coord 节点 {{ $labels.instance }} Commit Log shard 达 {{ $value }} 个（GC 可能停滞）"
          runbook_url: "https://github.com/byteforce-cn/coord/blob/main/docs/production/ops/runbook.md#coordkvtcommitlogshardshigh--commit-log-shard-数量异常"
          description: |
            shard 只按整 shard 回收（未 seal 或 watermark < end_ts 不回收）。
            先看 seal lag 与 watermark，再确认 watch_retention 是否被调大；
            不要手工删除 Commit Log 文件。

      # Shard seal 延迟 > 300s（D9 seal 超时）。
      - alert: CoordKvTShardSealLag
        expr: |
          coord_kv_t_commit_log_seal_lag_seconds > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "coord 节点 {{ $labels.instance }} Commit Log shard 已等待 seal {{ $value }}s"
          runbook_url: "https://github.com/byteforce-cn/coord/blob/main/docs/production/ops/runbook.md#coordkvtshardseallag--shard-seal-超时"
          description: |
            未 seal 的 shard 不进入 GC，也不会被 Watch 读到其 watermark 之后的部分。

      # Split/Merge operator 在 Running 状态超过 15m（仅 v2 节点）。
      - alert: CoordKvTSplitMergeStuck
        expr: |
          coord_pd_queue_running > 0
            and on(instance) (coord_kv_t_enabled == 1)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "coord 节点 {{ $labels.instance }} 有 {{ $value }} 个 Split/Merge operator 卡在 Running"
          runbook_url: "https://github.com/byteforce-cn/coord/blob/main/docs/production/ops/runbook.md#coordkvtsplitmergestuck--splitmerge-operator-卡住"
          description: |
            operator 超时会被 requeue（coord_pd_operator_requeued_total）；持续
            Running 通常是被 drain 的活跃事务/目标 Region leader 挡住。

      # Watch 历史窗口不足：客户端游标早于保留窗口（HISTORY_UNAVAILABLE）。
      - alert: CoordKvTWatchHistoryUnavailable
        expr: |
          increase(coord_kv_t_watch_history_unavailable_total[10m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "coord 节点 {{ $labels.instance }} Watch 订阅起点早于保留窗口（10m 内 {{ $value }} 次）"
          runbook_url: "https://github.com/byteforce-cn/coord/blob/main/docs/production/ops/runbook.md#coordkvtwatchhistoryunavailable--watch-历史窗口不足"
          description: |
            这是客户端游标过旧，不是服务端丢事件：让客户端用 Range 重建快照后
            从新 revision 订阅；不要用调大 watch_retention 掩盖。

  - name: coord-mq-v2
    rules:
      # 发布打到非 Leader 分片：客户端/Agent 会按 coord-leader-hint 重路由。
      # 持续出现 = leader 抖动或路由缓存陈旧，不是写入失败。
      - alert: CoordMqV2PublishNotLeader
        expr: |
          increase(coord_mq_v2_publish_not_leader_total[5m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "coord 节点 {{ $labels.instance }} MQ v2 发布持续命中非 Leader（10m 内 {{ $value }} 次）"
          runbook_url: "https://github.com/byteforce-cn/coord/blob/main/docs/production/ops/runbook.md#coordmqv2publishnotleader--mq-v2-发布持续非-leader"
          description: |
            数据面写必须发到分片 Leader；非 Leader 返回 NOT_LEADER +
            coord-leader-hint。持续重定向说明 shard leader 在切换或客户端路由
            缓存过期——先看 Region/PD leader，不要手工固定到某个节点。

      # 发布被服务端拒绝：配额、单条上限、分批上限或参数错误。
      - alert: CoordMqV2PublishRejected
        expr: |
          increase(coord_mq_v2_publish_rejected_total[10m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "coord 节点 {{ $labels.instance }} MQ v2 发布被拒绝（10m 内 {{ $value }} 次）"
          runbook_url: "https://github.com/byteforce-cn/coord/blob/main/docs/production/ops/runbook.md#coordmqv2publishrejected--mq-v2-发布被拒绝配额超大参数"
          description: |
            QUOTA_EXCEEDED / MESSAGE_TOO_LARGE / INVALID_ARGUMENT 是整批原子
            拒绝（不产生部分提交）。按返回的稳定错误码分支，不要重试到成功。

      # 平均发布延迟 > 200ms（含 Raft 提交与 apply）。
      - alert: CoordMqV2PublishLatencyHigh
        expr: |
          rate(coord_mq_v2_publish_latency_us_total[5m])
            / clamp_min(rate(coord_mq_v2_publish_requests_total[5m]), 0.001) > 200000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "coord 节点 {{ $labels.instance }} MQ v2 平均发布延迟 {{ $value | humanize }}us"
          runbook_url: "https://github.com/byteforce-cn/coord/blob/main/docs/production/ops/runbook.md#coordmqv2publishlatencyhigh--mq-v2-发布平均延迟--200ms"
          description: |
            发布延迟包含 Raft 多数派提交与 apply。先看磁盘 fdatasync、Raft
            append 队列与同分片的分区数；不要把它当成客户端超时重试问题。

      # 消费位点早于保留窗口（OFFSET_OUT_OF_RANGE）：保留已删掉未读消息。
      - alert: CoordMqV2PollOutOfRange
        expr: |
          increase(coord_mq_v2_poll_out_of_range_total[10m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "coord 节点 {{ $labels.instance }} MQ v2 消费位点早于保留窗口（10m 内 {{ $value }} 次）"
          runbook_url: "https://github.com/byteforce-cn/coord/blob/main/docs/production/ops/runbook.md#coordmqv2polloutofrange--mq-v2-消费位点早于保留窗口"
          description: |
            这是消费停滞导致保留窗口越过位点，不是服务端丢事件。处置是消费端的
            reset 策略（earliest/latest/fail）；不要用调大保留期掩盖。

      # Ack 被拒绝：代际过期、成员不存在或分区未分配给该成员。
      - alert: CoordMqV2AckRejected
        expr: |
          increase(coord_mq_v2_ack_rejected_total[10m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "coord 节点 {{ $labels.instance }} MQ v2 Ack 被拒绝（10m 内 {{ $value }} 次）"
          runbook_url: "https://github.com/byteforce-cn/coord/blob/main/docs/production/ops/runbook.md#coordmqv2ackrejected--mq-v2-ack-被拒绝代际分配"
          description: |
            GROUP_EPOCH_STALE / NOT_GROUP_MEMBER 要求重新 Join 后按新分配重试；
            committed 单调不回退。拒绝必须暴露给调用方，不能被吞。

      # 组再平衡占 Join 的比例 > 50%：成员抖动/心跳过期/消费者频繁重启。
      - alert: CoordMqV2GroupRebalanceStorm
        expr: |
          rate(coord_mq_v2_group_rebalances_total[10m])
            / clamp_min(rate(coord_mq_v2_group_joins_total[10m]), 0.001) > 0.5
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "coord 节点 {{ $labels.instance }} MQ v2 组再平衡比例 {{ $value | humanizePercentage }}"
          runbook_url: "https://github.com/byteforce-cn/coord/blob/main/docs/production/ops/runbook.md#coordmqv2grouprebalancestorm--mq-v2-消费组再平衡风暴"
          description: |
            再平衡期间同一分区会短暂无人消费，且旧代际 Ack 会被拒绝。查成员
            进程重启、session_timeout 与心跳间隔，不要靠调大超时掩盖。

      # 成员会话过期：消费者没在 session_timeout 内续期。
      - alert: CoordMqV2GroupMembersExpired
        expr: |
          increase(coord_mq_v2_group_expired_members_total[10m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "coord 节点 {{ $labels.instance }} MQ v2 消费组成员会话过期（10m 内 {{ $value }} 个）"
          runbook_url: "https://github.com/byteforce-cn/coord/blob/main/docs/production/ops/runbook.md#coordmqv2groupmembersexpired--mq-v2-消费组成员会话过期"
          description: |
            过期会推进 generation 并触发再平衡。先看消费者是否还活着/网络是否
            可达，再看心跳间隔是否接近 session_timeout。

      # 死信入队：消息被显式 MoveToDlq（含工作流触发器的 max_attempts）。
      - alert: CoordMqV2DlqMoved
        expr: |
          increase(coord_mq_v2_dlq_moved_total[10m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "coord 节点 {{ $labels.instance }} MQ v2 死信入队（10m 内 {{ $value }} 条）"
          runbook_url: "https://github.com/byteforce-cn/coord/blob/main/docs/production/ops/runbook.md#coordmqv2dlqmoved--mq-v2-死信入队"
          description: |
            DLQ 是"消费方处理不了"的审计出口。用 PollDlq 读 reason/detail，
            修好消费者后再决定是否重放；不要自动重放。

      # Subscribe 是 best-effort：背压时丢弃（不推进已提交位点）。
      - alert: CoordMqV2SubscribeDrops
        expr: |
          increase(coord_mq_v2_subscribe_dropped_total[10m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "coord 节点 {{ $labels.instance }} MQ v2 Subscribe 背压丢弃（10m 内 {{ $value }} 条）"
          runbook_url: "https://github.com/byteforce-cn/coord/blob/main/docs/production/ops/runbook.md#coordmqv2subscribedrops--mq-v2-subscribe-背压丢消息"
          description: |
            Subscribe 契约明确：队列打满即丢弃、不重投、不推进位点。需要至少
            一次必须改用 Poll + Ack；不要调大 buffer 当作可靠性承诺。
