[package]
name = "coord-core"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
coord-proto = { workspace = true }
prost = { workspace = true }
# `error_code`（第四轮 §3.14.2 的 wire 契约）需要 `tonic::{Code, Status}` 来附
# trailer。tonic 早已在 coord-core 的构建图中（经 coord-proto），本行不引入任何
# 新包；分层上 core 位于 proto 之上，使用其 gRPC 类型是既有方向。
tonic = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
thiserror = { workspace = true }
bytes = { workspace = true }
zeroize = { workspace = true }
tokio = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
ed25519-dalek = { workspace = true }
base64 = "0.22"
uuid = { workspace = true }
rand = { workspace = true }
async-trait = "0.1"
bincode = "1.3"

[dev-dependencies]
