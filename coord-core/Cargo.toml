[package]
name = "coord-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
coord-proto = { workspace = true }
prost = { workspace = true }
# `error_code`（第四轮 §3.14.2 的 wire 契约）需要 `tonic::{Code, Status}` 来附
# trailer。tonic 早已在 coord-core 的构建图中（经 coord-proto），本行不引入任何
# 新包；分层上 core 位于 proto 之上，使用其 gRPC 类型是既有方向。
tonic = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
thiserror = { workspace = true }
bytes = { workspace = true }
zeroize = { workspace = true }
tokio = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
ed25519-dalek = { workspace = true }
base64 = "0.22"
uuid = { workspace = true }
rand = { workspace = true }
async-trait = "0.1"
bincode = "1.3"

[dev-dependencies]
# 仅测试用：把 `coord_proto::FILE_DESCRIPTOR_SET` 反解成 FileDescriptorSet，
# 以便把 `is_streaming_rpc` 的手写清单与 descriptor 真值**双向**比对
# （见 grpc_auth.rs 的 `streaming_set_matches_the_proto_descriptors`）。
# 该 crate 已在 Cargo.lock 的依赖图里（经 tonic-reflection 链），不引入新依赖面。
prost-types = "0.14.4"
