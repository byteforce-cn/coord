[node]
id = 1
name = "coord-1"

[network]
grpc_addr = "0.0.0.0:50051"
raft_addr = "0.0.0.0:50052"
http_addr = "0.0.0.0:50061"

[cluster]
cluster_name = "compose-cluster"
bootstrap = true
initial_nodes = [
  { id = 1, grpc = "coord-1:50051", raft = "coord-1:50052" },
  { id = 2, grpc = "coord-2:50051", raft = "coord-2:50052" },
  { id = 3, grpc = "coord-3:50051", raft = "coord-3:50052" },
]

[storage]
data_dir = "/var/lib/coord"

[security]
auth_enabled = true
# 三节点一致（从 .env 的 AUTH_ROOT_KEY 填入，hex 64 字符）
auth_root_key = "__FILL_AUTH_ROOT_KEY__"
# R-SEC-03：三节点一致（从 .env 的 RAFT_SHARED_SECRET 填入，≥16 字符）
raft_shared_secret = "__FILL_RAFT_SHARED_SECRET__"
# 传输层 TLS/mTLS（gRPC + raft 同口径）：证书由 ./certs/gen-certs.sh 生成并挂载到
# /etc/coord/tls；三节点共用同一 server 证书（SAN 覆盖 coord-1/2/3 + localhost + 127.0.0.1）。
# 缺证书拒绝启动（fail-closed，coord/src/config.rs 校验）。
tls_cert = "/etc/coord/tls/server.crt"
tls_key = "/etc/coord/tls/server.key"
tls_ca = "/etc/coord/tls/ca.crt"
reflection_enabled = false
