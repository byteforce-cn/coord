name: CI

# P0-A.4 / P0-H / P1-03：PR 门禁与验收标准入 CI
#
# - fmt / clippy（非测试目标 -D warnings，测试目标警告级）/ panic 卡口
# - 全量 workspace 测试（含 restart_recovery_test / lease_raft_test /
#   snapshot_transfer_test / snapshot_rpc_test / compaction_raft_test /
#   m0_recovery_suite 真实二进制套件）
# - 前端 lint（coord-ui）
# - proto 契约（buf lint + 格式 + 对 main 的 breaking 检查，P2-03）
# - nightly 真实故障注入（chaos_real）
# - 每周性能基准（perf_bench + 劣化 >20% 门禁，P2-06）
# - 定时 cargo audit / cargo deny（安全依赖治理）
#
# 工具链版本由 rust-toolchain.toml 固定（Rust 1.98.1）。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # P0-H.4：nightly 触发真实故障注入套件（chaos_real 等 #[ignore] 套件）
  schedule:
    - cron: "17 2 * * *"
    # P1-03：每周依赖审计
    - cron: "0 4 * * 1"
    # P2-06：每周性能基准（劣化 >20% 告警）
    - cron: "0 6 * * 1"

concurrency:
  # 第四轮 §3.9⑦：三条 cron 的 `github.ref` 同为 `refs/heads/main`，旧的
  # `group: ci-${{ github.ref }}` + `cancel-in-progress: true` 会让 04:00 的依赖
  # 审计**静默取消** 02:17 的 60 分钟 chaos，06:00 的 perf 再取消 04:00。
  # 现在把 cron 表达式纳入 group，并禁止定时运行互相取消。
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event.schedule }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  lint:
    name: fmt + clippy -D warnings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc (coord-proto build dependency)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy (non-test targets, -D warnings) [P1-03]
        run: cargo clippy --workspace --lib --bins -- -D warnings
      - name: Clippy (all targets, warning level)
        run: cargo clippy --workspace --all-targets
      - name: Panic-path gate (non-test unwrap/expect/panic count = 0, P0-F.4)
        run: bash scripts/check-panics.sh
      - name: Alert ↔ runbook gate (W5-3 / P-Gate 7)
        # 每条告警必须有 runbook_url，且锚点必须在 runbook 文档里真实存在，
        # 且告警处置段里没有孤儿小节。纯文本 + python3，不需要 Rust/protoc。
        run: bash scripts/check-gate-drills.sh

  # 第四轮 §3.9⑥：**门禁自检**——这是唯一能区分「门禁存在」与「门禁生效」的机制。
  #
  # 背景：本仓 CI 曾连续 45 次全红而无人发现，根因是 `dtolnay/rust-toolchain@master`
  # 缺少 required input；YAML 里的卡口写得很认真，只是**从未跑起来**。
  # 静默失效无法靠"再读一遍 YAML"发现，只能靠"故意让它失败、断言它真的失败"。
  #
  # 做法：注入一个 fmt 违规，断言 `cargo fmt --check` 变红。若它**没有**变红，
  # 说明门禁已被绕过（工具链没装上 / 命令被改坏 / 被 || true 吞掉），本 job 失败。
  gate-self-check:
    name: gate self-check (fmt gate must fail on an injected violation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: Assert the fmt gate turns red on an injected violation
        run: |
          set -euo pipefail
          target=coord-core/src/kv_range.rs
          # 先确认基线是绿的（否则"注入后变红"没有信息量）
          cargo fmt --all -- --check
          printf '\nfn __gate_self_check() {let x=1;let _=x;}\n' >> "$target"
          if cargo fmt --all -- --check >/dev/null 2>&1; then
            echo "::error::fmt gate did NOT fail on an injected violation — the gate is not effective"
            exit 1
          fi
          echo "OK: fmt gate correctly turned red on the injected violation"
      - name: Assert the alert↔runbook gate turns red on an injected violation
        # W2-5：同一个自检思路用在**新加的**运维面卡口上。注入一条锚点失配
        # （把 runbook 的小节标题改名）⇒ 断言 `check-gate-drills.sh` 必须变红。
        # 没有这一步，新门禁可能与 fmt 门禁当初一样「写了但从未生效」。
        run: |
          set -euo pipefail
          runbook=docs/production/ops/runbook.md
          # 先确认基线是绿的（否则“注入后变红”没有信息量）
          bash scripts/check-gate-drills.sh
          python3 - "$runbook" <<'PY'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1])
          t = p.read_text(encoding="utf-8")
          old = "### `CoordNoLeader` — 集群 60s 无 leader"
          assert old in t, "self-check anchor missing: runbook 结构变了，请更新本步骤"
          p.write_text(t.replace(old, "### `CoordNoLeader` 集群无主", 1), encoding="utf-8")
          PY
          if bash scripts/check-gate-drills.sh >/dev/null 2>&1; then
            echo "::error::alert↔runbook gate did NOT fail on an injected anchor mismatch — the gate is not effective"
            exit 1
          fi
          echo "OK: alert↔runbook gate correctly turned red on the injected violation"

  frontend-lint:
    name: frontend lint (coord-ui)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coord-ui
    steps:
      - uses: actions/checkout@v4
      # 第四轮 §3.9④：`pnpm/action-setup@v4` 必须显式给 `version`
      # （`package.json` 无 `packageManager` 字段），否则 action 直接退出，
      # frontend job 第 3 步即死。lockfileVersion = 9.0。
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: coord-ui/pnpm-lock.yaml
      - name: Install deps (frozen lockfile, P0-G.2)
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Build
        run: pnpm build
      # 第四轮 §3.9④：coord-ui 的 vitest 单测此前**从未在 CI 里执行过**
      # （`package.json` 有 `test:ci`，但 job 只跑 lint + build）。
      # 注：`test:ci` 还包含 playwright e2e，而 e2e 的 `baseURL` 指向 agent 的
      # HTTP 端口（19528，UI 由 rust-embed 嵌入 agent 二进制）→ 需要真实 agent 进程，
      # 不适合放在本 job；本 job 只跑自包含的单测。
      - name: Unit tests (vitest, coverage)
        run: pnpm test:coverage

  java-sdk:
    name: java sdk (maven verify)
    # D3：Java SDK + example 此前**无任何 CI** —— 20+ 个 Java 测试文件从未被执行。
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 与 pom 的 <release>21</release> 对齐。注意：Mockito 5.12 的 inline mock
          # 尚不支持 JDK 25（ByteBuddy 无法 instrument），故不跟随最新 JDK。
          java-version: '21'
          cache: maven
      - name: SDK ↔ contract face smoke (G4)
        # G4：把 SDK 契约面卡口放到**SDK 自己的 job** 里，而不是只靠 contract-check
        # 那一条路径触发的 workflow。两层判据：
        #   ① 每个 GA impl 必须引用契约命名空间（防漂回内部 proto）；
        #   ② **反向**：每个 GA 契约包必须有一个 SDK 客户端面 —— 清单是代码从契约
        #      目录反推的，不依赖人记得同步改（P1-3「SDK 缺 6 个客户端面」正是
        #      人写清单漂移的结果）。
        # 不需要 maven/protoc，放在 `mvn verify` **之前**：纯文本断言，最快给出 反馈。
        run: bash apis/contracts/scripts/check-sdk-sync.sh
      - name: Java SDK — mvn verify (unit + contract tests)
        working-directory: coord-java-sdk
        run: mvn -B -q verify
      - name: Cross-language error-code contract (Rust ↔ Java)
        # 第四轮 §3.14.2：Java 的 `ErrorCode.fromProtoName` 对**未知** wire 值返回
        # INTERNAL（静默降级为"不可重试"）。因此 Rust 发出的每个码都必须在 Java 枚举
        # 里逐字存在——由脚本强制，而不是靠两侧各维护一份定义慢慢漂移。
        # 本步骤必须在 Java 编译之后：它直接解析 ErrorCode.java 的字面量。
        run: bash scripts/check-error-code-contract.sh
      - name: Java example — compile only
        # 第四轮 §3.14.7：此前叫 “compile & unit tests”，但 java-example 的默认
        # profile 排除了全部 51 个用例——该步骤实际跑 **0 个**测试。步骤名如实修正。
        # 真实进程集成测试（连本机 agent gRPC）由下面的 java-example-it job 跑。
        working-directory: java-example
        run: mvn -B -q verify -DskipTests

  java-example-it:
    name: java example integration (real server + agent)
    # D3 收口：Java 接入此前**零证据**。这里起真实 coord server + coord agent，
    # 再跑 java-example 的集成套件（KV/Txn/Lease/Watch/Registry），让
    # "Java 应用可通过 gRPC 接入"这句话有可复现的执行记录。
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc (coord-proto build dependency)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build coord binaries
        run: cargo build --workspace --bins
      - name: Start dev cluster (real server + agent)
        run: scripts/ci-java-it-cluster.sh start
      - name: Java example — integration suites
        working-directory: java-example
        run: mvn -B verify -Pit
      - name: Java SDK — integration suite (real cluster, -Pit)
        # 第三轮复核 §7.2-9：SDK 的 CoordClientIntegrationTest 此前靠 assumeThat 静默跳过，
        # 从不产生证据。现在它只在 -Pit 下执行，并由本 job 提供真实集群（硬失败即真门禁）。
        working-directory: coord-java-sdk
        run: mvn -B verify -Pit
      - name: Dump cluster logs (always)
        if: always()
        run: |
          echo "::group::coord server log"
          tail -200 .coord-dev-cluster/server.log 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::coord agent log"
          tail -200 .coord-dev-cluster/agent.log 2>/dev/null || true
          echo "::endgroup::"
      - name: Stop dev cluster
        if: always()
        run: scripts/ci-java-it-cluster.sh stop

  proto-lint:
    name: proto contract (buf lint + breaking)
    # P2-03：proto 契约治理——lint + 格式 + 对 main 的 breaking 检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: buf lint
        run: buf lint coord-proto
      - name: buf format (normalize so the breaking gate always runs)
        # 第四轮 §3.9③：此前这一步是 `buf format --diff --exit-code`，它一红，
        # 紧随其后的 `buf breaking`（protobuf 契约**破坏性变更门禁**）就永远
        # 执行不到——即该门禁在整个仓库生命周期内从未生效过。
        # 现在先 `-w` 归一化（保证 breaking 一定被执行），再把归一化产生的差异
        # 打印为 ::warning::（违规仍然可见，只是不再阻断后续门禁）。
        run: |
          set -euo pipefail
          before=$(mktemp -d)
          cp -r coord-proto "$before/"
          buf format -w coord-proto
          if ! diff -ru "$before/coord-proto" coord-proto; then
            echo "::warning::buf format rewrote the protos above; commit the formatted files"
          fi
      - name: buf breaking against main
        # 基线（main）尚无 buf.yaml 时跳过；合入本 PR 后下一 PR 起生效
        run: |
          if git show origin/main:coord-proto/buf.yaml >/dev/null 2>&1; then
            buf breaking coord-proto --against ".git#branch=origin/main,subdir=coord-proto"
          else
            echo "base revision has no buf.yaml; breaking gate active from next merge"
          fi

  test:
    name: workspace tests
    runs-on: ubuntu-latest
    # R-TST-21：测试 job 显式超时（此前无 timeout-minutes，卡死无上限）
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc (coord-proto build dependency)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Build tests
        run: cargo build --workspace --tests
      - name: Pre-clean leaked test processes
        # 进程级套件在超时/中断时会留下孤儿 `coord server`（本地实测可积累 30+ 个、
        # 最久 11 小时），它们抢 CPU/端口 → 后续套件出现假红
        # （"raft write timed out (no quorum?)"）。CI 是全新 VM，这步通常是 no-op，
        # 但能保证重跑/自托管 runner 上的确定性。只清理 /tmp/.tmp* 数据目录的进程。
        run: bash scripts/kill-stray-coord-procs.sh
      - name: Run workspace tests
        # E6：撤销「首次失败降级为 warning 并重跑」的口径——测试失败即红，
        # 不再用重跑掩盖不稳定。真 flaky 必须被修，而不是被重跑盖住。
        run: cargo test --workspace --no-fail-fast
      - name: Run deterministic simulation suites (gated)
        # 第三轮 §4.4：sim_jepsen/sim_chaos 是**自建模型**而非系统级证据，已用
        # `required-features = ["sim-tests"]` 移出默认套件（避免测试数量虚高）。
        # 这里显式跑它们，保证"移出默认"不等于"永不运行"。
        run: cargo test -p coord-server --features sim-tests --test sim_jepsen_test --test sim_chaos_test

  feature-matrix:
    name: plugin engine feature matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc (coord-proto build dependency)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      # 插件引擎 feature 门控：默认（plugin-js）、全开、全关三种组合必须构建通过
      - name: Check default features (plugin-js)
        run: cargo check -p coord-agent --all-targets
      - name: Check all plugin engines (js + wasm)
        run: cargo check -p coord-agent --all-targets --features plugin-js,plugin-wasm
      - name: Check no plugin engines
        run: cargo check -p coord-agent --all-targets --no-default-features
      # wasm 宿主（Phase 4）单测只在 feature 开启时存在 → 必须真正跑一遍，
      # 否则「构建通过」会掩盖沙箱行为回归（fuel/epoch/内存上限/能力边界）。
      - name: Run plugin engine tests (js + wasm)
        run: "cargo test -p coord-agent --lib --features plugin-js,plugin-wasm plugin::"
      # 插件指标（调用/trap/加载失败；含 wasm fuel/epoch 分类）——同一 feature 组合下验证。
      - name: Run plugin metrics tests
        run: "cargo test -p coord-agent --lib --features plugin-js,plugin-wasm metrics::"
      # 原生服务 = 真插件（内建插件）：gRPC 服务面由 PluginManager 动态组装，
      # 未启用的服务不得挂载。用真实的 AgentServer + 真实 gRPC 调用验证，而不是
      # 只断言注册表内容（「登记即算」正是本批次要消灭的东西）。
      - name: Run native-service plugin host tests (dynamic gRPC assembly)
        run: cargo test -p coord-agent --test agent_plugin_grpc_test
      # 组件模型 ABI（Phase 4.1）：组件夹具已提交仓库（`tests/fixtures/`），
      # 因此**不需要** wasm 工具链就能跑宿主侧的全部验收断言。
      - name: Run component-model plugin tests (committed fixture)
        run: |
          cargo test -p coord-agent --test agent_plugin_component_test --features plugin-js,plugin-wasm
      # 额外验证「从 guest 源码 + WIT 重建夹具」这条链路（rustc wasm 后端 + wasm-tools
      # embed/new + 无 WASI import 断言），再跑一次组件测试（这次用的是新产物）。
      - name: Install wasm guest toolchain
        run: |
          rustup target add wasm32-unknown-unknown
          curl -fsSL --retry 3 -o /tmp/wasm-tools.tar.gz \
            "https://github.com/bytecodealliance/wasm-tools/releases/download/v1.259.0/wasm-tools-1.259.0-x86_64-linux.tar.gz"
          tar xzf /tmp/wasm-tools.tar.gz -C /tmp
          sudo install -m 0755 /tmp/wasm-tools-1.259.0-x86_64-linux/wasm-tools /usr/local/bin/wasm-tools
          wasm-tools --version
      - name: Rebuild component fixture from source and re-run tests
        run: |
          scripts/build-plugin-guest.sh
          cargo test -p coord-agent --test agent_plugin_component_test --features plugin-js,plugin-wasm

  security-audit:
    name: cargo audit + deny
    # R-TST-21：audit/deny 从 schedule-only 改为 PR 门禁
    # （此前仅定时/手动执行，PR 不拦截已知漏洞依赖）
    #
    # ⚠️ 该 job 必须显式要 `checks: write`。
    #
    # 事故形态（已实测，见下）：`rustsec/audit-check@v2.0.0` 在**有东西要报告**时
    # （漏洞**或**信息性通告）会调 `checks/runs` 把结果写成 check run；若 token 没有
    # `checks: write`，它就 `core.setFailed("Resource not accessible by integration")`
    # —— **整个步骤变红**。
    # 也就是说：cargo audit 的 exit code 完全不参与判定（它以
    # `ignoreReturnCode: true` 调用），**权限才是**。
    # 于是出现最坏的形态：安全检查因为"没权限上报"而失败，而依赖本身是干净的 ——
    # 本次实测 `"vulnerabilities":{"found":false,"count":0}`，红的唯一原因是一条
    # **信息性**通告（bincode unmaintained，非漏洞）。
    #
    # 只给这一个 job 加权限（而不是顶层），把影响面限制在需要它的地方：
    # `contents: read` 供 checkout，`checks: write` 供审计结果上报。
    # 结果：信息性通告作为 check run **可见但不阻断**，真正的漏洞仍会拦住。
    permissions:
      contents: read
      checks: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc (coord-proto build dependency)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: cargo audit (RustSec)
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: cargo deny (licenses/bans)
        uses: EmbarkStudios/cargo-deny-action@v2

  chaos-nightly:
    name: real-process chaos (nightly + PR gate)
    # P0-H.4：真实故障注入套件。
    # E2：此前仅 schedule/手动触发 → PR 不跑，「验证过」在 PR 层无证据。
    # 现改为 PR + push + schedule/手动均执行。
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc (coord-proto build dependency)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Build tests
        run: cargo build --workspace --tests
      # 每个进程级套件之前都要清一次孤儿进程（而不只是 job 开头清一次）。
      #
      # 事故（已在本地复现并 A/B 定位）：本 job 里各套件**串行但相互污染**。
      # `chaos_real`（kill9）、soak、multi-raft、plugin_auth×3 都会在超时/中断时
      # 留下常驻孤儿 `coord server`/`coord agent`，它们继续抢 CPU/端口，于是**后面的**
      # 套件开始“看起来像产品 bug”的假红。本地实测：
      #   · 连跑一遍后残留孤儿 → `plugin_real_process_test` 红
      #     （`bootstrap-role ... raft auth write timed out (no quorum?)`）
      #   · `kill-stray-coord-procs.sh` 清一次 → 同一条命令、同一提交 **绿（4.03s）**
      # CI 上同一提交的不同表现（`missing CCT token`）是同一根因的另一种表现：
      # 负载下 agent 自举插件的 `Authenticate` 失败 → 插件降级为无凭据客户端。
      #
      # 脚本只清理数据目录（或 `--agent-config` 配置路径）位于 `/tmp/.tmp*` 的进程
      # ——即测试临时目录；不会碰真实集群。
      - name: Run real-process chaos suites
        env:
          CHAOS_REAL: "1"
        # 串行：kill9 与 soak 两个套件各起 3 个真实进程 + 6 个代理，
        # 并行互扰会导致节点就绪超时（2026-08-25 本地复现）
        run: |
          bash scripts/kill-stray-coord-procs.sh
          cargo test -p coord --test chaos_real -- --ignored --nocapture --test-threads=1
      - name: Run distributed soak (smoke, 120s)
        env:
          CHAOS_REAL: "1"
          SOAK_DURATION_SECS: "120"
        run: |
          bash scripts/kill-stray-coord-procs.sh
          cargo test -p coord --test chaos_real chaos_soak_distributed -- --ignored --nocapture
      # T5.18（R-MR-09）：Multi-Raft 进程级套件挂入 nightly——3 节点 × 3 Region
      # 真实进程 + kill/重启收敛（MULTI_RAFT_REAL=1）。与 chaos 套件同 job 串行
      # 执行（同 host 真实进程互扰规避：kill9 会误伤对端节点导致就绪超时）。
      - name: Run multi-raft real-process suite (T5.18)
        env:
          MULTI_RAFT_REAL: "1"
        run: |
          bash scripts/kill-stray-coord-procs.sh
          cargo test -p coord --test multi_raft_process_test -- --ignored --nocapture --test-threads=1
      # 批次 4/5：鉴权 + 插件账户进程套件——单节点重启存续（P0c + Bootstrap 引导）
      # + 双节点 raft 复制存续。同为 spawn 真实 `coord server` 的重型套件，与上述
      # 步骤同 job 串行执行（真实进程互扰规避）。
      # 批次 12：+ CLI 凭据文件套件（登录落盘 → 自动携带 → 到期自动续期 → 登出）。
      - name: Run auth/plugin process suites (single + multi-node + CLI credentials)
        run: |
          bash scripts/kill-stray-coord-procs.sh
          cargo test -p coord --test plugin_auth_process_test -- --ignored --nocapture --test-threads=1
          cargo test -p coord --test plugin_auth_multinode_process_test -- --ignored --nocapture --test-threads=1
          cargo test -p coord --test plugin_credentials_process_test -- --ignored --nocapture --test-threads=1
      # 批次 9：插件引擎**进程级**端到端（真实 server + 真实 agent 进程 + 磁盘 JS 插件）：
      # 插件身份开通 → 服务端 capability/scope 强制 → SIGHUP 内容级热重载 →
      # agent kill/重启（一次性引导令牌已消费，靠持久化账户续跑）。
      # 批次 12：+ **运行中新增插件**（SIGHUP 加入第二个插件，此时已无可用引导 CCT，
      # 靠自举的 provisioner 会话新建 `plugin/counter2` 账户并成功写 KV）。
      - name: Run plugin engine real-process e2e (PLUGIN_REAL=1)
        env:
          PLUGIN_REAL: "1"
        run: |
          bash scripts/kill-stray-coord-procs.sh
          cargo test -p coord --test plugin_real_process_test -- --ignored --nocapture --test-threads=1
      # 批次 10：coord-client **流式会话**（ObjectWriter / ObjectReader）真实进程验证
      # ——客户端自选块边界逐块发送（与服务端 4MiB 默认分帧不同）+ 服务端流逐块取回，
      # 跨 4MiB chunk 边界往返一致；含本地越界拒绝 / abort / 缺失对象。
      - name: Run object-storage streaming sessions (OBJECT_STORAGE_REAL=1)
        env:
          OBJECT_STORAGE_REAL: "1"
        run: |
          bash scripts/kill-stray-coord-procs.sh
          cargo test -p coord --test object_storage_process_test object_storage_real_streaming_sessions -- --ignored --nocapture --test-threads=1
      # 第四轮 A4：**「应用 → agent → server」在 auth_enabled=true 下的全链路**。
      # 本仓此前不存在这个组合（经 agent 的进程测试一律关闭鉴权、开鉴权的测试
      # 一律直连 server），这正是 A1–A3 能长期存在的原因。本套件是它们唯一的
      # 结构性回归保障：要求 agent 转发 CCT、scope 提取器在生产路径可用、
      # 能力表命中 `/coord.kv.KV/*`。
      - name: Run agent+auth real-process suite (AGENT_AUTH_REAL=1)
        env:
          AGENT_AUTH_REAL: "1"
        run: |
          bash scripts/kill-stray-coord-procs.sh
          cargo test -p coord --test agent_auth_process_test -- --ignored --nocapture --test-threads=1

  perf-bench:
    name: weekly perf baseline (regression gate)
    # P2-06：每周基准入仓 + 劣化 >20% 告警；也可手动触发
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc (coord-proto build dependency)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Run release benchmarks + regression gate
        run: bash scripts/bench-ci.sh
      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: perf-bench-report
          path: benchmark-results/report-*.md
          retention-days: 30
